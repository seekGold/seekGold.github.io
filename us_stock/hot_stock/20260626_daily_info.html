      }
      emptyState.style.display = "none";
      const showSequence = dataset.showSequence !== false;
      tbody.innerHTML = filteredRows.map((row, displayIndex) => {
        if (row.renderedHtml) {
          const sequenceCell = showSequence ? `<td class="is-sequence-cell">${displayIndex + 1}</td>` : "";
          return `<tr>${sequenceCell}${row.renderedHtml}</tr>`;
        }
        const rowHtml = dataset.columns.map((column, columnIndex) => {
          const cell = row.values[columnIndex] || ["-", null];
          const cellClasses = [];
          if (column.key === "名称") cellClasses.push("is-name-cell");
          if (column.key === "序号") cellClasses.push("is-sequence-cell");
          const dataColumn = ` data-column="${escapeHtml(column.key)}"`;
          const cellClass = cellClasses.length ? ` class="${cellClasses.join(" ")}"` : "";
          if (column.kind === "range") {
            return `<td${cellClass}${dataColumn}>${buildRangeCell(cell)}</td>`;
          }
          if (column.kind === "data-bar") {
            return `<td${cellClass}${dataColumn}>${buildMetricCell(cell, column)}</td>`;
          }
          return `<td${cellClass}${dataColumn}>${escapeHtml(cell[0] ?? "-")}</td>`;
        }).join("");
        const sequenceCell = showSequence ? `<td class="is-sequence-cell">${displayIndex + 1}</td>` : "";
        return `<tr>${sequenceCell}${rowHtml}</tr>`;
      }).join("");
      summary.textContent = `${dataset.title}: ${filteredRows.length} / ${dataset.rows.length} 行`;
    }

    globalSearch.addEventListener("input", (event) => {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    renderTabs();
    renderHeader();
    renderBody();
  </script>
</body>
</html>
