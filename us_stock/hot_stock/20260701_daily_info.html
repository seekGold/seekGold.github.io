      const promotedPrimaryTitles = new Set(["Top25成交", "N倍做多"]);
      const primaryTabs = datasets.filter((dataset) => dataset.tabRow !== "secondary" && !promotedPrimaryTitles.has(String(dataset.title || dataset.id || "")));
      const promotedPrimaryTabs = datasets.filter((dataset) => dataset.tabRow !== "secondary" && promotedPrimaryTitles.has(String(dataset.title || dataset.id || "")));
      const secondaryTabs = datasets.filter((dataset) => dataset.tabRow === "secondary");
      const activeDataset = getActiveDataset();
      const activeSecondaryGroup = activeDataset && activeDataset.tabRow === "secondary"
        ? String(activeDataset.tabGroup || activeDataset.tabKind || "theme")
        : "";
      const secondaryGroups = [];
      secondaryTabs.forEach((dataset) => {
        const groupId = String(dataset.tabGroup || dataset.tabKind || "theme");
        if (!secondaryGroups.some((group) => group.id === groupId)) {
          secondaryGroups.push({
            id: groupId,
            title: dataset.parentTitle || (groupId === "theme" ? "题材划分" : groupId),
            firstId: dataset.id,
          });
        }
      });
      const secondaryGroupPriority = new Map([["theme", 0], ["etf", 1]]);
      secondaryGroups.sort((left, right) => {
        const leftPriority = secondaryGroupPriority.has(left.id) ? secondaryGroupPriority.get(left.id) : 99;
        const rightPriority = secondaryGroupPriority.has(right.id) ? secondaryGroupPriority.get(right.id) : 99;
        return leftPriority - rightPriority;
      });
      const primaryButtons = primaryTabs.map((dataset) => `
        <button type="button" class="tab-btn ${dataset.id === state.activeId ? "active" : ""}${dataset.tabKind === "theme" ? " tab-btn-theme" : ""}" data-id="${escapeHtml(dataset.id)}">
          ${escapeHtml(dataset.title)} (${dataset.rowCount})
        </button>
      `);
      const secondaryParentButtons = secondaryGroups.map((group) => {
        const groupTabs = secondaryTabs.filter((dataset) => String(dataset.tabGroup || dataset.tabKind || "theme") === group.id);
        const parentRowCount = groupTabs.find((dataset) => Number.isFinite(Number(dataset.parentRowCount)))?.parentRowCount;
        const groupTotalCount = Number.isFinite(Number(parentRowCount))
          ? Number(parentRowCount)
          : groupTabs.reduce((total, dataset) => total + Number(dataset.rowCount || 0), 0);
        return `
          <button type="button" class="tab-btn tab-btn-theme ${activeSecondaryGroup === group.id ? "active" : ""}" data-id="${escapeHtml(group.firstId)}" data-secondary-parent="${escapeHtml(group.id)}">
            ${escapeHtml(group.title)} (${groupTotalCount})
          </button>
        `;
      });
      promotedPrimaryTabs.forEach((dataset) => {
        secondaryParentButtons.push(`
          <button type="button" class="tab-btn ${dataset.id === state.activeId ? "active" : ""}" data-id="${escapeHtml(dataset.id)}">
            ${escapeHtml(dataset.title)} (${dataset.rowCount})
          </button>
        `);
      });
      tabsPrimary.innerHTML = primaryButtons.join("");
      tabsSecondaryParents.innerHTML = secondaryParentButtons.join("");
      tabsSecondaryParents.style.display = secondaryParentButtons.length ? "flex" : "none";
      const visibleSecondaryTabs = activeSecondaryGroup
        ? secondaryTabs.filter((dataset) => String(dataset.tabGroup || dataset.tabKind || "theme") === activeSecondaryGroup)
        : [];
      tabsSecondary.innerHTML = visibleSecondaryTabs.map((dataset) => `
        <button type="button" class="tab-btn ${dataset.id === state.activeId ? "active" : ""}${dataset.tabKind === "theme" ? " tab-btn-theme" : ""}" data-id="${escapeHtml(dataset.id)}">
          ${escapeHtml(dataset.title)} (${dataset.rowCount})
        </button>
      `).join("");
      tabsSecondary.style.display = visibleSecondaryTabs.length ? "flex" : "none";
      [...tabsPrimary.querySelectorAll(".tab-btn"), ...tabsSecondaryParents.querySelectorAll(".tab-btn"), ...tabsSecondary.querySelectorAll(".tab-btn")].forEach((button) => {
        button.addEventListener("click", () => {
          state.activeId = button.dataset.id;
          state.search = "";
          globalSearch.value = "";
          renderTabs();
          renderHeader();
          renderBody();
        });
      });
    }

    function renderHeader() {
      const dataset = getActiveDataset();
      const sortState = state.sortById[dataset.id] || {};
      const showSequence = dataset.showSequence !== false;
      const headerHtml = [
        showSequence ? `
        <th class="is-sequence-cell">
          <div class="head-btn is-sequence-cell">
            <span>序号</span>
          </div>
        </th>
        ` : "",
        ...dataset.columns.map((column) => `
        <th${column.key === "序号" ? ' class="is-sequence-cell"' : ""} data-column="${escapeHtml(column.key)}">
          <button type="button" class="head-btn${column.key === "序号" ? " is-sequence-cell" : ""} ${sortState.sortKey === column.key ? "active" : ""}" data-key="${escapeHtml(column.key)}">
            <span>${escapeHtml(column.label)}</span>
            <span class="sort-indicator">${sortState.sortKey === column.key ? (sortState.sortDesc ? "▼" : "▲") : "↕"}</span>
          </button>
        </th>
      `),
      ].join("");
      thead.innerHTML = `<tr>${headerHtml}</tr>`;
      thead.querySelectorAll(".head-btn").forEach((button) => {
        if (!button.dataset.key) return;
        button.addEventListener("click", () => {
          const sortConfig = state.sortById[dataset.id];
          const key = button.dataset.key;
          if (sortConfig.sortKey === key) {
            sortConfig.sortDesc = !sortConfig.sortDesc;
          } else {
            sortConfig.sortKey = key;
            sortConfig.sortDesc = true;
          }
          renderHeader();
          renderBody();
        });
      });
    }

    function getFilteredRows(dataset) {
      const searchText = state.search;
      return dataset.rows.filter((row) => {
        return !searchText || row.search.includes(searchText);
      });
    }

    function sortRows(dataset, rows) {
      const columnIndexMap = getColumnIndexMap(dataset);
      const sortState = state.sortById[dataset.id] || {};
      if (!sortState.sortKey) {
        return rows.slice();
      }
      const sortIndex = columnIndexMap[sortState.sortKey];
      return rows.slice().sort((leftRow, rightRow) => {
        const leftCell = leftRow.values[sortIndex] || ["-", null];
        const rightCell = rightRow.values[sortIndex] || ["-", null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null && leftNumeric !== undefined && rightNumeric !== null && rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          result = String(leftCell[0] ?? "").localeCompare(String(rightCell[0] ?? ""), "zh-Hans-CN", { numeric: true, sensitivity: "base" });
        }
        return sortState.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? "-");
      if (numeric === null || numeric === undefined) {
        return `<span class="metric-text">${display}</span>`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric >= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase > 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillColorVar = numeric >= 0 ? "var(--up-soft)" : "var(--down-soft)";
      const trackColorVar = numeric >= 0 ? "var(--up-track)" : "var(--down-track)";
      const gradientColor = numeric >= 0
        ? (themeName === "light" ? "rgba(52, 211, 153, 0.96)" : "rgba(54, 179, 126, 0.96)")
        : (themeName === "light" ? "rgba(248, 113, 113, 0.96)" : "rgba(235, 83, 83, 0.96)");
      const gradientTail = numeric >= 0
        ? (themeName === "light" ? "rgba(110, 231, 183, 0.78)" : "rgba(73, 201, 146, 0.82)")
        : (themeName === "light" ? "rgba(252, 165, 165, 0.78)" : "rgba(244, 114, 114, 0.82)");
      return `
        <div class="metric-cell">
          <span class="metric-track" style="background: rgba(${trackColorVar}, 0.65);">
            <span class="metric-fill" style="width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, 0.82);"></span>
            <span class="metric-value">${display}</span>
          </span>
        </div>
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `<span class="metric-text">${escapeHtml(cell[0] ?? "-")}</span>`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const fillWidth = Math.max(currentRatio * 100, 6);
      const isPrevMode = String(meta.kind || "") === "prev";
      const fillGradient = isPrevMode
        ? "linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)"
        : "linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)";
      const markerColor = isPrevMode ? "#60A5FA" : "#F59E0B";
      const referenceHtml = referenceRatio === null
        ? ""
        : '<span class="range-track-ref" style="left:' + (referenceRatio * 100) + '%;"></span>';
      return `
        <div class="range-cell">
          <div class="range-current">${escapeHtml(formatRangeNumber(current))}</div>
          <div class="range-track-shell">
            <span class="range-track-fill" style="width:${fillWidth}%; background:${fillGradient};"></span>
            ${referenceHtml}
            <span class="range-track-marker" style="left:${currentRatio * 100}%; background:${markerColor};"></span>
          </div>
          <div class="range-labels">
            <span>${escapeHtml(formatRangeNumber(domainMin))}</span>
            <span>${escapeHtml(formatRangeNumber(domainMax))}</span>
          </div>
        </div>
      `;
    }

    function renderBody() {
      const dataset = getActiveDataset();
      const filteredRows = sortRows(dataset, getFilteredRows(dataset));
      if (!filteredRows.length) {
        tbody.innerHTML = "";
        emptyState.style.display = "block";
        summary.textContent = `${dataset.title}: 0 / ${dataset.rows.length} 行`;
        return;
      }
      emptyState.style.display = "none";
      const showSequence = dataset.showSequence !== false;
      tbody.innerHTML = filteredRows.map((row, displayIndex) => {
        if (row.renderedHtml) {
          const sequenceCell = showSequence ? `<td class="is-sequence-cell">${displayIndex + 1}</td>` : "";
          return `<tr>${sequenceCell}${row.renderedHtml}</tr>`;
        }
        const rowHtml = dataset.columns.map((column, columnIndex) => {
          const cell = row.values[columnIndex] || ["-", null];
          const cellClasses = [];
          if (column.key === "名称") cellClasses.push("is-name-cell");
          if (column.key === "序号") cellClasses.push("is-sequence-cell");
          const dataColumn = ` data-column="${escapeHtml(column.key)}"`;
          const cellClass = cellClasses.length ? ` class="${cellClasses.join(" ")}"` : "";
          if (column.kind === "range") {
            return `<td${cellClass}${dataColumn}>${buildRangeCell(cell)}</td>`;
          }
          if (column.kind === "data-bar") {
            return `<td${cellClass}${dataColumn}>${buildMetricCell(cell, column)}</td>`;
          }
          return `<td${cellClass}${dataColumn}>${escapeHtml(cell[0] ?? "-")}</td>`;
        }).join("");
        const sequenceCell = showSequence ? `<td class="is-sequence-cell">${displayIndex + 1}</td>` : "";
        return `<tr>${sequenceCell}${rowHtml}</tr>`;
      }).join("");
      summary.textContent = `${dataset.title}: ${filteredRows.length} / ${dataset.rows.length} 行`;
    }

    globalSearch.addEventListener("input", (event) => {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    renderTabs();
    renderHeader();
    renderBody();
  </script>
</body>
</html>
