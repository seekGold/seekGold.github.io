  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {

;, 90.49], [&quot;-1.39%&quot;, -1.39], [&quot;83.31%&quot;, 83.31], [&quot;346.1&quot;, 346.1]], &quot;search&quot;: &quot;avgo 博通 427.36 2.61% 1.44% 2.38% 23.48% 2.02 90.49 -1.39% 83.31% 346.1&quot;}];
    const defaultSortColumn = &quot;今日涨幅&quot;;
    const defaultSortDesc = true;
    const themeName = &quot;dark&quot;;
    const columnIndexMap = Object.fromEntries(columns.map((column, index) =&gt; [column.key, index]));
    const state = {
      search: &quot;&quot;,
      sortKey: defaultSortColumn,
      sortDesc: defaultSortDesc,
    };

    const thead = document.getElementById(&quot;thead&quot;);
    const tbody = document.getElementById(&quot;tbody&quot;);
    const summary = document.getElementById(&quot;summary&quot;);
    const emptyState = document.getElementById(&quot;emptyState&quot;);
    const globalSearch = document.getElementById(&quot;globalSearch&quot;);
    const resetSearchButton = document.getElementById(&quot;resetSearch&quot;);

    function escapeHtml(value) {
      return String(value)
        .replace(/&amp;/g, &quot;&amp;amp;&quot;)
        .replace(/&lt;/g, &quot;&amp;lt;&quot;)
        .replace(/&gt;/g, &quot;&amp;gt;&quot;)
        .replace(/&quot;/g, &quot;&amp;quot;&quot;)
        .replace(/&#x27;/g, &quot;&amp;#39;&quot;);

    function renderHeader() {
      const headerHtml = columns.map((column) =&gt; `
        &lt;th&gt;

            &lt;span&gt;${escapeHtml(column.label)}&lt;/span&gt;
            &lt;span class=&quot;sort-indicator&quot;&gt;&lt;/span&gt;
          &lt;/button&gt;
        &lt;/th&gt;
      `).join(&quot;&quot;);
      thead.innerHTML = `&lt;tr&gt;${headerHtml}&lt;/tr&gt;`;
      thead.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const key = button.dataset.key;
          if (state.sortKey === key) {
            state.sortDesc = !state.sortDesc;
          } else {
            state.sortKey = key;
            state.sortDesc = true;
          }
          renderBody();
          updateSortIndicators();
        });
      });
      updateSortIndicators();
    }

    function updateSortIndicators() {
      document.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        const indicator = button.querySelector(&quot;.sort-indicator&quot;);
        const isActive = button.dataset.key === state.sortKey;
        button.classList.toggle(&quot;active&quot;, isActive);
        indicator.textContent = isActive ? (state.sortDesc ? &quot;▼&quot; : &quot;▲&quot;) : &quot;↕&quot;;
      });
    }

    function getFilteredRows() {
      const searchText = state.search;
      return allRows.filter((row) =&gt; {
        return !searchText || row.search.includes(searchText);
      });
    }

    function sortRows(rows) {
      if (!state.sortKey) {
        return rows.slice();
      }
      const sortIndex = columnIndexMap[state.sortKey];
      return rows.slice().sort((leftRow, rightRow) =&gt; {
        const leftCell = leftRow.values[sortIndex] || [&quot;-&quot;, null];
        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          const leftText = String(leftCell[0] ?? &quot;&quot;);
          const rightText = String(rightCell[0] ?? &quot;&quot;);
          result = leftText.localeCompare(rightText, &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });
        }
        return state.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;

        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;

          }
          return `&lt;td${nameClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;

    renderHeader();
    renderBody();

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],

    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const nameClass = column.key === &quot;名称&quot; ? &quot; class=\&quot;is-name-cell\&quot;&quot; : &quot;&quot;;
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${nameClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${nameClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${nameClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();

    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

  function resolvePriority(text) {

    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)

    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });

    const themeName = &quot;dark&quot;;
    const columnIndexMap = Object.fromEntries(columns.map((column, index) =&gt; [column.key, index]));
    const state = {
      search: &quot;&quot;,
      sortKey: defaultSortColumn,
      sortDesc: defaultSortDesc,
    };

    const thead = document.getElementById(&quot;thead&quot;);
    const tbody = document.getElementById(&quot;tbody&quot;);
    const summary = document.getElementById(&quot;summary&quot;);
    const emptyState = document.getElementById(&quot;emptyState&quot;);
    const globalSearch = document.getElementById(&quot;globalSearch&quot;);
    const resetSearchButton = document.getElementById(&quot;resetSearch&quot;);

    function escapeHtml(value) {
      return String(value)
        .replace(/&amp;/g, &quot;&amp;amp;&quot;)
        .replace(/&lt;/g, &quot;&amp;lt;&quot;)
        .replace(/&gt;/g, &quot;&amp;gt;&quot;)
        .replace(/&quot;/g, &quot;&amp;quot;&quot;)
        .replace(/&#x27;/g, &quot;&amp;#39;&quot;);
    }

    function renderHeader() {
      const headerHtml = columns.map((column) =&gt; `
        &lt;th&gt;
          &lt;button type=&quot;button&quot; class=&quot;head-btn&quot; data-key=&quot;${escapeHtml(column.key)}&quot;&gt;
            &lt;span&gt;${escapeHtml(column.label)}&lt;/span&gt;
            &lt;span class=&quot;sort-indicator&quot;&gt;&lt;/span&gt;
          &lt;/button&gt;
        &lt;/th&gt;
      `).join(&quot;&quot;);
      thead.innerHTML = `&lt;tr&gt;${headerHtml}&lt;/tr&gt;`;
      thead.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const key = button.dataset.key;
          if (state.sortKey === key) {
            state.sortDesc = !state.sortDesc;
          } else {
            state.sortKey = key;
            state.sortDesc = true;
          }
          renderBody();
          updateSortIndicators();
        });
      });
      updateSortIndicators();
    }

    function updateSortIndicators() {
      document.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        const indicator = button.querySelector(&quot;.sort-indicator&quot;);
        const isActive = button.dataset.key === state.sortKey;
        button.classList.toggle(&quot;active&quot;, isActive);
        indicator.textContent = isActive ? (state.sortDesc ? &quot;▼&quot; : &quot;▲&quot;) : &quot;↕&quot;;
      });
    }

    function getFilteredRows() {
      const searchText = state.search;
      return allRows.filter((row) =&gt; {
        return !searchText || row.search.includes(searchText);
      });
    }

    function sortRows(rows) {
      if (!state.sortKey) {
        return rows.slice();
      }
      const sortIndex = columnIndexMap[state.sortKey];
      return rows.slice().sort((leftRow, rightRow) =&gt; {
        const leftCell = leftRow.values[sortIndex] || [&quot;-&quot;, null];
        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          const leftText = String(leftCell[0] ?? &quot;&quot;);
          const rightText = String(rightCell[0] ?? &quot;&quot;);
          result = leftText.localeCompare(rightText, &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });
        }
        return state.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const nameClass = column.key === &quot;名称&quot; ? &quot; class=\&quot;is-name-cell\&quot;&quot; : &quot;&quot;;
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${nameClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${nameClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${nameClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

&lt;script&gt;
(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],
    [&quot;芯片&quot;, 5],
    [&quot;龙头股&quot;, 10],
    [&quot;龙头&quot;, 10],
    [&quot;七姐妹&quot;, 20],
    [&quot;半导体&quot;, 30],
    [&quot;活跃Top20&quot;, 45],
    [&quot;Top成交&quot;, 45],
    [&quot;Top20&quot;, 45],
    [&quot;指数分析&quot;, 50],
    [&quot;指数&quot;, 50],
    [&quot;纳指100统计&quot;, 60],
    [&quot;纳指100交互数据&quot;, 60],
    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();
&lt;/script&gt;

        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const nameClass = column.key === &quot;名称&quot; ? &quot; class=\&quot;is-name-cell\&quot;&quot; : &quot;&quot;;
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${nameClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${nameClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${nameClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

&lt;script&gt;
(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],
    [&quot;芯片&quot;, 5],
    [&quot;龙头股&quot;, 10],
    [&quot;龙头&quot;, 10],
    [&quot;七姐妹&quot;, 20],
    [&quot;半导体&quot;, 30],
    [&quot;活跃Top20&quot;, 45],
    [&quot;Top成交&quot;, 45],
    [&quot;Top20&quot;, 45],
    [&quot;指数分析&quot;, 50],
    [&quot;指数&quot;, 50],
    [&quot;纳指100统计&quot;, 60],
    [&quot;纳指100交互数据&quot;, 60],
    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();
&lt;/script&gt;

  <script>
    const useSwitchTabs = false;
    const columnWidthRange = document.getElementById("columnWidthRange");
    const columnGapRange = document.getElementById("columnGapRange");
    const columnWidthValue = document.getElementById("columnWidthValue");
    const columnGapValue = document.getElementById("columnGapValue");
    const nameFontSizeRange = document.getElementById("nameFontSizeRange");
    const nameFontSizeValue = document.getElementById("nameFontSizeValue");
    const resetColumnLayout = document.getElementById("resetColumnLayout");
    const previewIframes = Array.from(document.querySelectorAll("iframe"));
    const columnStorageKey = "实时数据_合并交互_column_layout";
    const isTradeRecordPreview = false;

    function buildIframeColumnStyle() {
      return `
        :root {
          --combined-cell-min-width: ${columnWidthRange?.value || "92"}px;
          --combined-cell-gap: ${columnGapRange?.value || "0"}px;
          --combined-name-font-size: ${nameFontSizeRange?.value || "14"}px;
        }
        table, .dataframe, [role="table"] {
          min-width: 100% !important;
          border-collapse: separate !important;
          border-spacing: var(--combined-cell-gap) 0 !important;
        }
        th, td, [role="columnheader"], [role="cell"] {
          min-width: var(--combined-cell-min-width) !important;
        }
        .combined-name-cell {
          font-size: var(--combined-name-font-size) !important;
          line-height: 1.25;
        }
      `;
    }

    function updateColumnValueText() {
      if (columnWidthValue && columnWidthRange) {
        columnWidthValue.textContent = `${columnWidthRange.value}px`;
      }
      if (columnGapValue && columnGapRange) {
        columnGapValue.textContent = `${columnGapRange.value}px`;
      }
      if (nameFontSizeValue && nameFontSizeRange) {
        nameFontSizeValue.textContent = `${nameFontSizeRange.value}px`;
      }
    }

    function tagNameColumnsInDocument(doc) {
      const tableRoots = Array.from(doc.querySelectorAll("table, .dataframe, [role='table']"));
      tableRoots.forEach((table) => {
        table.querySelectorAll(".combined-name-cell").forEach((cell) => {
          cell.classList.remove("combined-name-cell");
        });
        const headerRow = table.querySelector("thead tr") || table.querySelector("tr") || table.querySelector("[role='row']");
        if (!headerRow) {
          return;
        }
        const headerCells = Array.from(headerRow.querySelectorAll("th, td, [role='columnheader'], [role='cell']"));
        const nameIndex = headerCells.findIndex((cell) => String(cell.textContent || "").trim() === "名称");
        if (nameIndex < 0) {
          return;
        }
        const rowSelector = table.matches("[role='table']") ? "[role='row']" : "tr";
        table.querySelectorAll(rowSelector).forEach((row) => {
          const cells = Array.from(row.querySelectorAll("th, td, [role='columnheader'], [role='cell']"));
          const targetCell = cells[nameIndex];
          if (targetCell) {
            targetCell.classList.add("combined-name-cell");
          }
        });
      });
    }

    function applyColumnLayoutToIframe(iframe) {
      try {
        const doc = iframe.contentDocument;
        if (!doc || !doc.documentElement) {
          return;
        }
        let styleTag = doc.getElementById("combinedColumnControlStyle");
        if (!styleTag) {
          styleTag = doc.createElement("style");
          styleTag.id = "combinedColumnControlStyle";
          doc.head?.appendChild(styleTag);
        }
        styleTag.textContent = buildIframeColumnStyle();
        tagNameColumnsInDocument(doc);
      } catch (_error) {}
    }

    function applyColumnLayout() {
      updateColumnValueText();
      previewIframes.forEach((iframe) => applyColumnLayoutToIframe(iframe));
      try {
        localStorage.setItem(
          columnStorageKey,
          JSON.stringify({
            width: columnWidthRange?.value || "92",
            gap: columnGapRange?.value || "0",
            nameSize: nameFontSizeRange?.value || "14",
          })
        );
      } catch (_error) {}
    }

    function restoreColumnLayout() {
      try {
        const raw = localStorage.getItem(columnStorageKey);
        if (!raw) {
          updateColumnValueText();
          return;
        }
        const saved = JSON.parse(raw);
        if (columnWidthRange && saved?.width) {
          columnWidthRange.value = String(saved.width);
        }
        if (columnGapRange && saved?.gap) {
          columnGapRange.value = String(saved.gap);
        }
        if (nameFontSizeRange && saved?.nameSize) {
          nameFontSizeRange.value = String(saved.nameSize);
        }
      } catch (_error) {}
      updateColumnValueText();
    }

    previewIframes.forEach((iframe) => {
      iframe.addEventListener("load", () => applyColumnLayoutToIframe(iframe));
    });

    if (isTradeRecordPreview) {
      const outerViewButtons = Array.from(document.querySelectorAll(".outer-view-btn"));
      function applyTradeRecordView(viewKey) {
        outerViewButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.view === viewKey);
        });
        previewIframes.forEach((iframe) => {
          try {
            const targetWindow = iframe.contentWindow;
            if (targetWindow && typeof targetWindow.setTradeRecordView === "function") {
              targetWindow.setTradeRecordView(viewKey);
            }
          } catch (_error) {}
        });
      }
      outerViewButtons.forEach((button) => {
        button.addEventListener("click", () => applyTradeRecordView(button.dataset.view));
      });
      previewIframes.forEach((iframe) => {
        iframe.addEventListener("load", () => {
          const activeButton = outerViewButtons.find((button) => button.classList.contains("active"));
          applyTradeRecordView(activeButton?.dataset.view || "record");
        });
      });
    }

    if (useSwitchTabs) {
      const buttons = Array.from(document.querySelectorAll(".switch-btn"));
      const panels = Array.from(document.querySelectorAll(".page-card"));
      function setActivePanel(panelId) {
        buttons.forEach((button) => {
          button.classList.toggle("active", button.dataset.panel === panelId);
        });
        panels.forEach((panel) => {
          panel.classList.toggle("active", panel.dataset.panel === panelId);
        });
      }
      buttons.forEach((button) => {
        button.addEventListener("click", () => setActivePanel(button.dataset.panel));
      });
      if (buttons.length) {
        setActivePanel(buttons[0].dataset.panel);
      }
    }
    columnWidthRange?.addEventListener("input", applyColumnLayout);
    columnGapRange?.addEventListener("input", applyColumnLayout);
    nameFontSizeRange?.addEventListener("input", applyColumnLayout);
    resetColumnLayout?.addEventListener("click", () => {
      if (columnWidthRange) {
        columnWidthRange.value = "92";
      }
      if (columnGapRange) {
        columnGapRange.value = "0";
      }
      if (nameFontSizeRange) {
        nameFontSizeRange.value = "14";
      }
      applyColumnLayout();
    });
    restoreColumnLayout();
    applyColumnLayout();
  </script>
