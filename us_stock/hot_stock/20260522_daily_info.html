      overflow: visible;
      background: transparent;
    }

      height: 268px;
      min-height: 220px;
      background: transparent;
    }
    iframe {
      width: calc(100% / var(--preview-scale));
      height: calc(var(--preview-height) / var(--preview-scale));
      border: 0;
      display: block;
      background: #111827;
      transform: scale(var(--preview-scale));
      transform-origin: top left;

    @media (max-width: 960px) {
      :root {
        --preview-scale: 0.82;

        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],

    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],

    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],
    [&quot;芯片&quot;, 5],

    [&quot;龙头&quot;, 10],

    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });

})();

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {

  } else {

  }

  setTimeout(reorderGroupedButtons, 120);
})();

      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

      state.search = event.target.value.toLowerCase().trim();

  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {

  } else {
    reorderGroupedButtons();
  }

  setTimeout(reorderGroupedButtons, 120);
})();

      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],

    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

    function updateSortIndicators() {
      document.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        const indicator = button.querySelector(&quot;.sort-indicator&quot;);
        const isActive = button.dataset.key === state.sortKey;

    function getFilteredRows() {

    function sortRows(rows) {
      if (!state.sortKey) {
        return rows.slice();

      const sortIndex = columnIndexMap[state.sortKey];
      return rows.slice().sort((leftRow, rightRow) =&gt; {
        const leftCell = leftRow.values[sortIndex] || [&quot;-&quot;, null];
        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          const leftText = String(leftCell[0] ?? &quot;&quot;);
          const rightText = String(rightCell[0] ?? &quot;&quot;);
          result = leftText.localeCompare(rightText, &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });
        }
        return state.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;

        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;

          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;

            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {

      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive

    function renderBody() {

      if (!filteredRows.length) {

          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {

        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;

      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

(function () {

    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

    function getActiveDataset() {

        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];

        const rightNumeric = rightCell[1];

        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;

          result = String(leftCell[0] ?? &quot;&quot;).localeCompare(String(rightCell[0] ?? &quot;&quot;), &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });

    function buildMetricCell(cell, column) {

    function buildRangeCell(cell) {

      summary.textContent = `${dataset.title}: ${filteredRows.length} / ${dataset.rows.length} 行`;

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }

  setTimeout(reorderGroupedButtons, 120);
})();

          summaryItems.find((item) => matcher(normalizeLabel(getLabelElement(item)?.textContent || ""), item)) || null;
        const primaryDateItem = summaryItems.find((item) => {
          const labelText = normalizeLabel(getLabelElement(item)?.textContent || "");
          return labelText.includes("最新日期");
        });
        const fallbackDateItem = summaryItems.find((item) => {
          const labelText = normalizeLabel(getLabelElement(item)?.textContent || "");
          return labelText.includes("匹配日期");
        });
        const overviewDateItem = primaryDateItem || fallbackDateItem || null;
        if (overviewDateItem) {
          const labelElement = getLabelElement(overviewDateItem);
          if (labelElement) {
            labelElement.textContent = "最新日期";
          }
        }
        summaryItems.forEach((item) => {
          const labelElement = getLabelElement(item);
          const labelText = normalizeLabel(labelElement?.textContent || "");
          const shouldRemove =
            labelText.includes("1个月前") ||
            labelText.includes("1年前") ||
            labelText.includes("历史区间") ||
            labelText.includes("信号/基准窗口") ||
            labelText.includes("近距低位") ||
            labelText.includes("近距区间") ||
            labelText.includes("样本行数") ||
            (labelText.includes("匹配日期") && item !== overviewDateItem);
          item.style.display = shouldRemove ? "none" : "";
        });
        const nestedSummaryItems = Array.from(
          summaryRoot?.querySelectorAll(".metric-inline-item, .metric-combo-item") || []
        ).filter((item) => item instanceof HTMLElement);
        nestedSummaryItems.forEach((item) => {
          const labelElement = item.querySelector(
            ".metric-inline-label, .metric-combo-label, .metric-label, .label"
          );
          const labelText = normalizeLabel(labelElement?.textContent || "");
          const shouldRemove =
            labelText.includes("1个月前") ||
            labelText.includes("1年前") ||
            labelText.includes("历史区间") ||
            labelText.includes("信号/基准窗口") ||
            labelText.includes("近距低位") ||
            labelText.includes("近距区间") ||
            labelText.includes("样本行数") ||
            labelText.includes("匹配日期");
          item.style.display = shouldRemove ? "none" : "";
        });
        if (overviewDateItem && overviewTitle.includes("VIX&VXN&Fear")) {
          const latestVixItem = findSummaryItem((labelText, item) =>
            item !== overviewDateItem && item.style.display !== "none" && labelText.includes("最新vix")
          );
          if (latestVixItem && summaryRoot.firstElementChild !== latestVixItem) {
            summaryRoot.insertBefore(latestVixItem, summaryRoot.firstElementChild);
          }
          if (latestVixItem && latestVixItem.nextElementSibling !== overviewDateItem) {
            latestVixItem.insertAdjacentElement("afterend", overviewDateItem);
          }
        }
        if (overviewDateItem && overviewTitle.includes("巴菲特指数")) {
          const latestBuffettItem = findSummaryItem((labelText, item) =>
            item !== overviewDateItem && item.style.display !== "none" && labelText.includes("buffettindicator")
          );
          if (latestBuffettItem && summaryRoot.firstElementChild !== latestBuffettItem) {
            summaryRoot.insertBefore(latestBuffettItem, summaryRoot.firstElementChild);
          }
          if (latestBuffettItem && latestBuffettItem.nextElementSibling !== overviewDateItem) {
            latestBuffettItem.insertAdjacentElement("afterend", overviewDateItem);
          }
        }
        if (overviewTitle.includes("QQQ市场宽度")) {
          const maOverviewCard = summaryItems.find((item) => {
            const labelText = normalizeLabel(getLabelElement(item)?.textContent || "");
            return labelText.includes("ma5/ma10/ma20/ma50/ma120");
          });
          const latestCard = summaryItems.find((item) => {
            const labelText = normalizeLabel(getLabelElement(item)?.textContent || "");
            return labelText.includes("最新日期");
          });
          const maOverviewLabel = maOverviewCard ? getLabelElement(maOverviewCard) : null;
          if (maOverviewLabel) {
            maOverviewLabel.style.display = "none";
          }
          const ma120Item = maOverviewCard?.querySelector(".metric-combo-item.ma-accent-ma120");
          if (ma120Item && latestCard && !latestCard.querySelector(".overview-ma120-card")) {
            const clone = ma120Item.cloneNode(true);
            if (clone instanceof HTMLElement) {
              clone.classList.add("overview-ma120-card");
              latestCard.appendChild(clone);
            }
            if (ma120Item instanceof HTMLElement) {
              ma120Item.style.display = "none";
            }
          }
        }
        summaryItems.forEach((item) => {
          const labelElement = getLabelElement(item);
          const valueElement = item.querySelector(".metric-value, .value, .metric-inline-value, .metric-combo-value, .metric-main-value");
          const labelText = normalizeLabel(labelElement?.textContent || "");
          if (!valueElement) {
            return;
          }
          if (
            labelText.includes("当前状态") ||
            labelText.includes("当前情绪") ||
            labelText.includes("最新状态") ||
            labelText.includes("buffettindicator")
          ) {
            valueElement.style.color = "#f59e0b";
          } else if (
            labelText.includes("最新vix") ||
            labelText.includes("最新vxn") ||
            labelText.includes("最新指数") ||
            labelText.includes("最新naaim") ||
            labelText.includes("最新qqq") ||
            labelText.includes("最新spy") ||
            labelText.includes("最新纳指100")
          ) {
            valueElement.style.color = "#60a5fa";
          } else if (
            labelText.includes("最新市值gdp比") ||
            labelText.includes("buffettindicator")
          ) {
            valueElement.style.color = "#f87171";
          }
        });
        const visibleSummaryItems = summaryItems.filter((item) => item.style.display !== "none");
        const visibleDateItem = visibleSummaryItems.find((item) => item === overviewDateItem) || null;
        const shouldPinDateFirst = !(
          overviewTitle.includes("VIX&VXN&Fear") ||
          overviewTitle.includes("NAAIM仓位") ||
          overviewTitle.includes("巴菲特指数")
        );
        if (shouldPinDateFirst) {
          if (visibleDateItem && summaryRoot.firstElementChild !== visibleDateItem) {
            summaryRoot.insertBefore(visibleDateItem, summaryRoot.firstElementChild);
          } else if (!visibleDateItem && overviewDateItem) {
            overviewDateItem.style.display = "";
            summaryRoot.insertBefore(overviewDateItem, summaryRoot.firstElementChild);
          }
        }
        const summaryHeight = Math.max(
          summaryRoot?.scrollHeight || 0,
          doc.body?.scrollHeight || 0,
          doc.documentElement?.scrollHeight || 0,
          120,
        );
        iframe.style.height = `${Math.min(summaryHeight + 12, 360)}px`;
        window.setTimeout(() => {
          try {
            const nextHeight = Math.max(
              summaryRoot?.scrollHeight || 0,
              doc.body?.scrollHeight || 0,
              doc.documentElement?.scrollHeight || 0,
              120,
            );
            iframe.style.height = `${Math.min(nextHeight + 12, 360)}px`;
          } catch (_error) {}
        }, 240);
      } catch (_error) {}
    }

    function applyColumnLayout() {
      if (!showColumnControls) {
        return;
      }
      updateColumnValueText();
      previewIframes.forEach((iframe) => applyColumnLayoutToIframe(iframe));
      try {
        localStorage.setItem(
          columnStorageKey,
          JSON.stringify({
            width: columnWidthRange?.value || "84",
            gap: columnGapRange?.value || "0",
            nameSize: nameFontSizeRange?.value || "14",
          })
        );
      } catch (_error) {}
    }

    function restoreColumnLayout() {
      if (!showColumnControls) {
        return;
      }
      try {
        const raw = localStorage.getItem(columnStorageKey);
        if (!raw) {
          updateColumnValueText();
          return;
        }
        const saved = JSON.parse(raw);
        if (columnWidthRange && saved?.width) {
          columnWidthRange.value = String(saved.width);
        }
        if (columnGapRange && saved?.gap) {
          columnGapRange.value = String(saved.gap);
        }
        if (nameFontSizeRange && saved?.nameSize) {
          nameFontSizeRange.value = String(saved.nameSize);
        }
      } catch (_error) {}
      updateColumnValueText();
    }

    previewIframes.forEach((iframe) => {
      const applyPreviewEnhancements = () => {
        applyColumnLayoutToIframe(iframe);
        applyOverviewSummaryToIframe(iframe);
      };
      iframe.addEventListener("load", applyPreviewEnhancements);
      applyPreviewEnhancements();
      window.setTimeout(applyPreviewEnhancements, 120);
      window.setTimeout(applyPreviewEnhancements, 480);
    });

    const overviewPeriodButtons = Array.from(document.querySelectorAll('.overview-period-btn[data-overview-period]'));
    function applyOverviewPeriod(periodKey) {
      overviewPeriodButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.overviewPeriod === periodKey);
      });
      previewIframes.forEach((iframe) => {
        if (!iframe.closest('.overview-summary')) {
          return;
        }
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (!doc) {
            return;
          }
          doc.querySelectorAll('.metric-period-card').forEach((card) => {
            const raw = card.getAttribute('data-period-values') || '{}';
            const values = JSON.parse(raw);
            const valueNode = card.querySelector('.metric-period-value');
            if (valueNode) {
              valueNode.textContent = values[periodKey] || '-';
            }
          });
        } catch (_error) {}
      });
    }
    overviewPeriodButtons.forEach((button) => {
      button.addEventListener('click', () => applyOverviewPeriod(button.dataset.overviewPeriod || '3y'));
    });
    if (overviewPeriodButtons.length) {
      applyOverviewPeriod('3y');
    }

    if (isTradeRecordPreview) {
      const outerViewButtons = Array.from(document.querySelectorAll(".outer-view-btn"));
      function applyTradeRecordView(viewKey) {
        outerViewButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.view === viewKey);
        });
        previewIframes.forEach((iframe) => {
          try {
            const targetWindow = iframe.contentWindow;
            if (targetWindow && typeof targetWindow.setTradeRecordView === "function") {
              targetWindow.setTradeRecordView(viewKey);
            }
          } catch (_error) {}
        });
      }
      outerViewButtons.forEach((button) => {
        button.addEventListener("click", () => applyTradeRecordView(button.dataset.view));
      });
      previewIframes.forEach((iframe) => {
        iframe.addEventListener("load", () => {
          const activeButton = outerViewButtons.find((button) => button.classList.contains("active"));
          applyTradeRecordView(activeButton?.dataset.view || "record");
        });
      });
    }

    if (useSwitchTabs) {
      const buttons = Array.from(document.querySelectorAll(".switch-row .switch-btn[data-panel]"));
      const panels = Array.from(document.querySelectorAll(".page-card"));
      function setActivePanel(panelId) {
        if (!panelId) {
          return;
        }
        buttons.forEach((button) => {
          button.classList.toggle("active", button.dataset.panel === panelId);
        });
        panels.forEach((panel) => {
          panel.classList.toggle("active", panel.dataset.panel === panelId);
        });
      }
      buttons.forEach((button) => {
        button.addEventListener("click", () => setActivePanel(button.dataset.panel));
      });
      if (buttons.length) {
        setActivePanel(defaultPanelId || buttons[0].dataset.panel);
      }
    }
    if (showColumnControls) {
      columnWidthRange?.addEventListener("input", applyColumnLayout);
      columnGapRange?.addEventListener("input", applyColumnLayout);
      nameFontSizeRange?.addEventListener("input", applyColumnLayout);
      resetColumnLayout?.addEventListener("click", () => {
        if (columnWidthRange) {
            columnWidthRange.value = "84";
        }
        if (columnGapRange) {
          columnGapRange.value = "0";
        }
        if (nameFontSizeRange) {
          nameFontSizeRange.value = "14";
        }
        applyColumnLayout();
      });
      restoreColumnLayout();
      applyColumnLayout();
    }
  </script>
</body>
</html>
