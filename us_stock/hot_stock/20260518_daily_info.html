        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],

    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],

    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {

  } else {
    reorderGroupedButtons();
  }

  setTimeout(reorderGroupedButtons, 120);
})();

      if (normalizedText.includes(keyword)) {

    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });

      --up-track: 23, 37, 34;
      --down-track: 60, 22, 28;
      --text-on-bar: #f9fafb;
      --table-head: #2f2f2f;
      --table-filter: #353535;
      --toolbar-input-bg: #2b2b2b;
      --toolbar-input-text: #f9fafb;
      --toolbar-button-bg: #2b2b2b;
      --toolbar-button-text: #f9fafb;
      --odd-row: rgba(255,255,255,0.02);
      --hover-row: rgba(96, 165, 250, 0.08);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
      --metric-min-width: 120px;
      --header-height: 44px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
      min-height: 100%;
    }
    body {
      padding: 18px;
    }
    .page {
      max-width: 1600px;
      margin: 0 auto;
    }
    .hero {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 18px 20px 14px;
      margin-bottom: 14px;
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
    }
    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .toolbar input {
      min-width: 260px;
      max-width: 420px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--toolbar-input-bg);
      color: var(--toolbar-input-text);
      outline: none;
    }
    .toolbar button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--toolbar-button-bg);
      color: var(--toolbar-button-text);
      cursor: pointer;
    }
    .summary {
      color: var(--muted);
      font-size: 13px;
      margin-left: auto;
    }
    .table-wrap {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: auto;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 980px;
      table-layout: auto;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--table-head);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0;
      text-align: center;
      white-space: nowrap;
    }
    .head-btn {
      width: 100%;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .head-btn.active {
      color: var(--accent);
    }
    .sort-indicator {
      display: none;
    }
    tbody tr:nth-child(odd) td {
      background: var(--odd-row);
    }
    tbody tr:hover td {
      background: var(--hover-row);
    }
    td {
      position: relative;
      padding: 11px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 14px;
      white-space: nowrap;
      vertical-align: middle;
      text-align: center;
    }
    td.is-name-cell {
      font-weight: 700;
      color: #C084FC;
    }
    th.is-sequence-cell,
    td.is-sequence-cell {
      width: 56px;
      min-width: 56px;
      max-width: 56px;
      padding-left: 6px;
      padding-right: 6px;
    }
    .head-btn.is-sequence-cell {
      padding-left: 6px;
      padding-right: 6px;
    }
    .metric-cell {
      position: relative;
      min-width: var(--metric-min-width);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .metric-track {
      position: relative;
      width: min(100%, 132px);
      min-width: 112px;
      height: 22px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(148, 163, 184, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
    }
    .metric-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 999px;
    }
    .metric-value {
      position: absolute;
      inset: 0 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.1px;
      z-index: 1;
      pointer-events: none;
    }
    .metric-text {
      font-weight: 700;
      color: var(--text);
    }
    .range-cell {
      min-width: 176px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
    }
    .range-current {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      color: var(--text);
    }
    .range-track-shell {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      overflow: visible;
    }
    .range-track-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
    }
    .range-track-ref {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 2px;
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      transform: translateX(-50%);
    }
    .range-track-marker {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.92);
      background: #f8fafc;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.12);
    }
    .range-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .empty {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;page&quot;&gt;
    &lt;section class=&quot;hero&quot;&gt;
      &lt;h1&gt;纳指100市值Top30&lt;/h1&gt;
      &lt;p&gt;支持排序、搜索；涨幅与回撤列附带数据条。&lt;/p&gt;
    &lt;/section&gt;
    &lt;div class=&quot;toolbar&quot;&gt;
      &lt;input id=&quot;globalSearch&quot; type=&quot;search&quot; placeholder=&quot;搜索代码、名称或任意列内容&quot; /&gt;
      &lt;button id=&quot;resetSearch&quot; type=&quot;button&quot;&gt;清空搜索&lt;/button&gt;
      &lt;div id=&quot;summary&quot; class=&quot;summary&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead id=&quot;thead&quot;&gt;&lt;/thead&gt;
        &lt;tbody id=&quot;tbody&quot;&gt;&lt;/tbody&gt;
      &lt;/table&gt;
      &lt;div id=&quot;emptyState&quot; class=&quot;empty&quot; style=&quot;display:none;&quot;&gt;没有匹配的数据&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    const columns = [];
    const allRows = [];
    const defaultSortColumn = &quot;市值&quot;;
    const defaultSortDesc = true;
    const themeName = &quot;dark&quot;;
    const columnIndexMap = Object.fromEntries(columns.map((column, index) =&gt; [column.key, index]));
    const state = {
      search: &quot;&quot;,
      sortKey: defaultSortColumn,
      sortDesc: defaultSortDesc,
    };

    const thead = document.getElementById(&quot;thead&quot;);
    const tbody = document.getElementById(&quot;tbody&quot;);
    const summary = document.getElementById(&quot;summary&quot;);
    const emptyState = document.getElementById(&quot;emptyState&quot;);
    const globalSearch = document.getElementById(&quot;globalSearch&quot;);
    const resetSearchButton = document.getElementById(&quot;resetSearch&quot;);

    function escapeHtml(value) {
      return String(value)
        .replace(/&amp;/g, &quot;&amp;amp;&quot;)
        .replace(/&lt;/g, &quot;&amp;lt;&quot;)
        .replace(/&gt;/g, &quot;&amp;gt;&quot;)
        .replace(/&quot;/g, &quot;&amp;quot;&quot;)
        .replace(/&#x27;/g, &quot;&amp;#39;&quot;);
    }

    function formatRangeNumber(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(2) : &quot;-&quot;;
    }

    function formatRangeNumber(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(2) : &quot;-&quot;;
    }

    function renderHeader() {
      const headerHtml = columns.map((column) =&gt; `
        &lt;th${column.key === &quot;序号&quot; ? &#x27; class=&quot;is-sequence-cell&quot;&#x27; : &quot;&quot;}&gt;
          &lt;button type=&quot;button&quot; class=&quot;head-btn${column.key === &quot;序号&quot; ? &quot; is-sequence-cell&quot; : &quot;&quot;}&quot; data-key=&quot;${escapeHtml(column.key)}&quot;&gt;
            &lt;span&gt;${escapeHtml(column.label)}&lt;/span&gt;
            &lt;span class=&quot;sort-indicator&quot;&gt;&lt;/span&gt;
          &lt;/button&gt;
        &lt;/th&gt;
      `).join(&quot;&quot;);
      thead.innerHTML = `&lt;tr&gt;${headerHtml}&lt;/tr&gt;`;
      thead.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const key = button.dataset.key;
          if (state.sortKey === key) {
            state.sortDesc = !state.sortDesc;
          } else {
            state.sortKey = key;
            state.sortDesc = true;
          }
          renderBody();
          updateSortIndicators();
        });
      });
      updateSortIndicators();
    }

    function updateSortIndicators() {
      document.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        const indicator = button.querySelector(&quot;.sort-indicator&quot;);
        const isActive = button.dataset.key === state.sortKey;
        button.classList.toggle(&quot;active&quot;, isActive);
        indicator.textContent = isActive ? (state.sortDesc ? &quot;▼&quot; : &quot;▲&quot;) : &quot;↕&quot;;
      });
    }

    function getFilteredRows() {
      const searchText = state.search;
      return allRows.filter((row) =&gt; {
        return !searchText || row.search.includes(searchText);
      });
    }

    function sortRows(rows) {
      if (!state.sortKey) {
        return rows.slice();
      }
      const sortIndex = columnIndexMap[state.sortKey];
      return rows.slice().sort((leftRow, rightRow) =&gt; {
        const leftCell = leftRow.values[sortIndex] || [&quot;-&quot;, null];
        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          const leftText = String(leftCell[0] ?? &quot;&quot;);
          const rightText = String(rightCell[0] ?? &quot;&quot;);
          result = leftText.localeCompare(rightText, &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });
        }
        return state.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

&lt;script&gt;
(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],
    [&quot;芯片&quot;, 5],
    [&quot;龙头股&quot;, 10],
    [&quot;龙头&quot;, 10],
    [&quot;七姐妹&quot;, 20],
    [&quot;半导体&quot;, 30],
    [&quot;活跃Top20&quot;, 45],
    [&quot;Top成交&quot;, 45],
    [&quot;Top20&quot;, 45],
    [&quot;指数分析&quot;, 50],
    [&quot;指数&quot;, 50],
    [&quot;超级股&quot;, 55],
    [&quot;纳指100小市值交互数据&quot;, 59],
    [&quot;纳指100小市值&quot;, 59],
    [&quot;纳指100统计&quot;, 60],
    [&quot;纳指100交互数据&quot;, 60],
    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();
&lt;/script&gt;

        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],
    [&quot;芯片&quot;, 5],
    [&quot;龙头股&quot;, 10],
    [&quot;龙头&quot;, 10],
    [&quot;七姐妹&quot;, 20],
    [&quot;半导体&quot;, 30],
    [&quot;活跃Top20&quot;, 45],
    [&quot;Top成交&quot;, 45],
    [&quot;Top20&quot;, 45],
    [&quot;指数分析&quot;, 50],
    [&quot;指数&quot;, 50],
    [&quot;超级股&quot;, 55],
    [&quot;纳指100小市值交互数据&quot;, 59],
    [&quot;纳指100小市值&quot;, 59],
    [&quot;纳指100统计&quot;, 60],
    [&quot;纳指100交互数据&quot;, 60],
    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

            &lt;span&gt;${escapeHtml(column.label)}&lt;/span&gt;
            &lt;span class=&quot;sort-indicator&quot;&gt;&lt;/span&gt;
          &lt;/button&gt;
        &lt;/th&gt;
      `).join(&quot;&quot;);
      thead.innerHTML = `&lt;tr&gt;${headerHtml}&lt;/tr&gt;`;
      thead.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const key = button.dataset.key;
          if (state.sortKey === key) {
            state.sortDesc = !state.sortDesc;
          } else {
            state.sortKey = key;
            state.sortDesc = true;
          }
          renderBody();
          updateSortIndicators();
        });
      });
      updateSortIndicators();
    }

    function updateSortIndicators() {
      document.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        const indicator = button.querySelector(&quot;.sort-indicator&quot;);
        const isActive = button.dataset.key === state.sortKey;
        button.classList.toggle(&quot;active&quot;, isActive);
        indicator.textContent = isActive ? (state.sortDesc ? &quot;▼&quot; : &quot;▲&quot;) : &quot;↕&quot;;
      });
    }

    function getFilteredRows() {
      const searchText = state.search;
      return allRows.filter((row) =&gt; {
        return !searchText || row.search.includes(searchText);
      });
    }

    function sortRows(rows) {
      if (!state.sortKey) {
        return rows.slice();
      }
      const sortIndex = columnIndexMap[state.sortKey];
      return rows.slice().sort((leftRow, rightRow) =&gt; {
        const leftCell = leftRow.values[sortIndex] || [&quot;-&quot;, null];
        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          const leftText = String(leftCell[0] ?? &quot;&quot;);
          const rightText = String(rightCell[0] ?? &quot;&quot;);
          result = leftText.localeCompare(rightText, &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });
        }
        return state.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}
            &lt;span class=&quot;range-track-marker&quot; style=&quot;left:${currentRatio * 100}%; background:${markerColor};&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;range-labels&quot;&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMin))}&lt;/span&gt;
            &lt;span&gt;${escapeHtml(formatRangeNumber(domainMax))}&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      `;
    }

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {
        return &quot;&quot;;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive
        ? ` style=&quot;background: rgba(var(--up), ${alpha.toFixed(3)})&quot;`
        : ` style=&quot;background: rgba(var(--down), ${alpha.toFixed(3)})&quot;`;
    }

    function renderBody() {
      const filteredRows = sortRows(getFilteredRows());
      if (!filteredRows.length) {
        tbody.innerHTML = &quot;&quot;;
        emptyState.style.display = &quot;block&quot;;
        summary.textContent = `0 / ${allRows.length} 行`;
        return;
      }
      emptyState.style.display = &quot;none&quot;;
      tbody.innerHTML = filteredRows.map((row) =&gt; {
        const rowHtml = columns.map((column, columnIndex) =&gt; {
          const cell = row.values[columnIndex] || [&quot;-&quot;, null];
          const cellClasses = [];
          if (column.key === &quot;名称&quot;) cellClasses.push(&quot;is-name-cell&quot;);
          if (column.key === &quot;序号&quot;) cellClasses.push(&quot;is-sequence-cell&quot;);
          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;data-bar&quot;) {
            return `&lt;td${cellClass}&gt;${buildMetricCell(cell, column)}&lt;/td&gt;`;
          }
          if (column.kind === &quot;heatmap&quot;) {
            return `&lt;td${cellClass}${getHeatmapStyle(cell, column)}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
          }
          return `&lt;td${cellClass}&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/td&gt;`;
        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;
      }).join(&quot;&quot;);
      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;
    }

    globalSearch.addEventListener(&quot;input&quot;, (event) =&gt; {
      state.search = event.target.value.toLowerCase().trim();
      renderBody();
    });

    resetSearchButton.addEventListener(&quot;click&quot;, () =&gt; {
      state.search = &quot;&quot;;
      globalSearch.value = &quot;&quot;;
      renderBody();
    });

    renderHeader();
    renderBody();
  &lt;/script&gt;

(function () {
  const keywordPriorityPairs = [
    [&quot;芯片股&quot;, 5],
    [&quot;芯片&quot;, 5],
    [&quot;龙头股&quot;, 10],
    [&quot;龙头&quot;, 10],
    [&quot;七姐妹&quot;, 20],
    [&quot;半导体&quot;, 30],
    [&quot;活跃Top20&quot;, 45],
    [&quot;Top成交&quot;, 45],
    [&quot;Top20&quot;, 45],
    [&quot;指数分析&quot;, 50],
    [&quot;指数&quot;, 50],
    [&quot;超级股&quot;, 55],
    [&quot;纳指100小市值交互数据&quot;, 59],
    [&quot;纳指100小市值&quot;, 59],
    [&quot;纳指100统计&quot;, 60],
    [&quot;纳指100交互数据&quot;, 60],
    [&quot;纳指100&quot;, 60],
    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

    function escapeHtml(value) {

    function renderHeader() {

          &lt;button type=&quot;button&quot; class=&quot;head-btn${column.key === &quot;序号&quot; ? &quot; is-sequence-cell&quot; : &quot;&quot;}&quot; data-key=&quot;${escapeHtml(column.key)}&quot;&gt;

      thead.innerHTML = `&lt;tr&gt;${headerHtml}&lt;/tr&gt;`;
      thead.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {

          const key = button.dataset.key;
          if (state.sortKey === key) {
            state.sortDesc = !state.sortDesc;
          } else {
            state.sortKey = key;
            state.sortDesc = true;

          renderBody();
          updateSortIndicators();
        });
      });
      updateSortIndicators();
    }

    function updateSortIndicators() {
      document.querySelectorAll(&quot;.head-btn&quot;).forEach((button) =&gt; {
        const indicator = button.querySelector(&quot;.sort-indicator&quot;);
        const isActive = button.dataset.key === state.sortKey;
        button.classList.toggle(&quot;active&quot;, isActive);
        indicator.textContent = isActive ? (state.sortDesc ? &quot;▼&quot; : &quot;▲&quot;) : &quot;↕&quot;;

    function getFilteredRows() {
      const searchText = state.search;
      return allRows.filter((row) =&gt; {

    function sortRows(rows) {
      if (!state.sortKey) {
        return rows.slice();
      }
      const sortIndex = columnIndexMap[state.sortKey];
      return rows.slice().sort((leftRow, rightRow) =&gt; {
        const leftCell = leftRow.values[sortIndex] || [&quot;-&quot;, null];
        const rightCell = rightRow.values[sortIndex] || [&quot;-&quot;, null];
        const leftNumeric = leftCell[1];
        const rightNumeric = rightCell[1];
        let result = 0;
        if (leftNumeric !== null &amp;&amp; leftNumeric !== undefined &amp;&amp; rightNumeric !== null &amp;&amp; rightNumeric !== undefined) {
          result = leftNumeric - rightNumeric;
        } else {
          const leftText = String(leftCell[0] ?? &quot;&quot;);
          const rightText = String(rightCell[0] ?? &quot;&quot;);
          result = leftText.localeCompare(rightText, &quot;zh-Hans-CN&quot;, { numeric: true, sensitivity: &quot;base&quot; });
        }
        return state.sortDesc ? -result : result;
      });
    }

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillAlpha = themeName === &quot;light&quot;
        ? (0.70 + ratio * 0.20).toFixed(3)
        : (0.34 + ratio * 0.40).toFixed(3);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;
      const trackAlpha = themeName === &quot;light&quot; ? &quot;0.65&quot; : &quot;0.55&quot;;
      const gradientColor = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(52, 211, 153, 0.96)&quot; : &quot;rgba(54, 179, 126, 0.96)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `
        &lt;div class=&quot;metric-cell&quot;&gt;
          &lt;span class=&quot;metric-track&quot; style=&quot;background: rgba(${trackColorVar}, ${trackAlpha});&quot;&gt;
            &lt;span class=&quot;metric-fill&quot; style=&quot;width:${width}%; background: linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow: inset 0 0 0 1px rgba(${fillColorVar}, ${fillAlpha});&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function buildRangeCell(cell) {
      const meta = cell[2];
      if (!meta) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${escapeHtml(cell[0] ?? &quot;-&quot;)}&lt;/span&gt;`;
      }
      const domainMin = Number(meta.domainMin);
      const domainMax = Number(meta.domainMax);
      const current = Number(meta.current);
      const reference = meta.reference === null || meta.reference === undefined ? null : Number(meta.reference);
      const span = Math.max(domainMax - domainMin, 0.0001);
      const currentRatio = Math.min(Math.max((current - domainMin) / span, 0), 1);
      const referenceRatio = reference === null ? null : Math.min(Math.max((reference - domainMin) / span, 0), 1);
      const isPrevMode = String(meta.kind || &quot;&quot;) === &quot;prev&quot;;
      let fillLeft = 0;
      let fillWidth = Math.max(currentRatio * 100, 6);
      let fillGradient = isPrevMode
        ? &quot;linear-gradient(90deg, rgba(59, 130, 246, 0.92) 0%, rgba(125, 211, 252, 0.82) 100%)&quot;
        : &quot;linear-gradient(90deg, rgba(249, 115, 22, 0.92) 0%, rgba(251, 191, 36, 0.82) 100%)&quot;;
      const markerColor = isPrevMode ? &quot;#60A5FA&quot; : &quot;#F59E0B&quot;;
      let referenceHtml = referenceRatio === null
        ? &quot;&quot;
        : &#x27;&lt;span class=&quot;range-track-ref&quot; style=&quot;left:&#x27; + (referenceRatio * 100) + &#x27;%;&quot;&gt;&lt;/span&gt;&#x27;;
      if (!isPrevMode &amp;&amp; referenceRatio !== null) {
        fillLeft = Math.min(referenceRatio, currentRatio) * 100;
        fillWidth = Math.max(Math.abs(currentRatio - referenceRatio) * 100, 4);
        fillGradient = currentRatio &gt;= referenceRatio
          ? &quot;linear-gradient(90deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;
          : &quot;linear-gradient(270deg, rgba(253, 224, 71, 0.42) 0%, rgba(245, 158, 11, 0.90) 100%)&quot;;
        referenceHtml = &quot;&quot;;
      }
      return `
        &lt;div class=&quot;range-cell&quot;&gt;
          &lt;div class=&quot;range-current&quot;&gt;${escapeHtml(formatRangeNumber(current))}&lt;/div&gt;
          &lt;div class=&quot;range-track-shell&quot;&gt;
            &lt;span class=&quot;range-track-fill&quot; style=&quot;left:${fillLeft}%; width:${fillWidth}%; background:${fillGradient};&quot;&gt;&lt;/span&gt;
            ${referenceHtml}

    function getHeatmapStyle(cell, column) {
      const numeric = cell[1];
      if (numeric === null || numeric === undefined) {

      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const alpha = themeName === &quot;light&quot; ? 0.10 + ratio * 0.24 : 0.18 + ratio * 0.56;
      const isPositive = numeric &gt;= 0;
      return isPositive

          const cellClass = cellClasses.length ? ` class=&quot;${cellClasses.join(&quot; &quot;)}&quot;` : &quot;&quot;;
          if (column.kind === &quot;range&quot;) {
            return `&lt;td${cellClass}&gt;${buildRangeCell(cell)}&lt;/td&gt;`;

        }).join(&quot;&quot;);
        return `&lt;tr&gt;${rowHtml}&lt;/tr&gt;`;

      summary.textContent = `${filteredRows.length} / ${allRows.length} 行`;

(function () {

    [&quot;名称涨跌&quot;, 70],
    [&quot;名称涨幅图&quot;, 70]
  ];

  function resolvePriority(text) {
    const normalizedText = String(text || &quot;&quot;).trim();
    for (const [keyword, priority] of keywordPriorityPairs) {
      if (normalizedText.includes(keyword)) {
        return priority;
      }
    }
    return 999;
  }

  function reorderButtonContainer(container) {
    const candidates = Array.from(container.children).filter((element) =&gt;
      element.matches(&quot;button, a, [role=&#x27;button&#x27;]&quot;)
    );
    if (candidates.length &lt; 2) {
      return;
    }
    const taggedItems = candidates.map((element, index) =&gt; ({
      element,
      index,
      priority: resolvePriority(element.textContent),
    }));
    const matchedCount = taggedItems.filter((item) =&gt; item.priority &lt; 999).length;
    if (matchedCount &lt; 2) {
      return;
    }
    taggedItems
      .sort((left, right) =&gt; left.priority - right.priority || left.index - right.index)
      .forEach((item) =&gt; {
        container.appendChild(item.element);
      });
  }

  function reorderGroupedButtons() {
    document.querySelectorAll(&quot;div, nav, section&quot;).forEach((container) =&gt; {
      reorderButtonContainer(container);
    });
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, reorderGroupedButtons, { once: true });
  } else {
    reorderGroupedButtons();
  }
  requestAnimationFrame(reorderGroupedButtons);
  setTimeout(reorderGroupedButtons, 120);
})();

    function buildMetricCell(cell, column) {
      const numeric = cell[1];
      const display = escapeHtml(cell[0] ?? &quot;-&quot;);
      if (numeric === null || numeric === undefined) {
        return `&lt;span class=&quot;metric-text&quot;&gt;${display}&lt;/span&gt;`;
      }
      const positiveMax = column.positiveMax || 0;
      const negativeMax = column.negativeMax || 0;
      const ratioBase = numeric &gt;= 0 ? positiveMax : negativeMax;
      const ratio = ratioBase &gt; 0 ? Math.min(Math.abs(numeric) / ratioBase, 1) : 0;
      const width = numeric === 0 ? 0 : Math.max(ratio * 100, 8);
      const fillColorVar = numeric &gt;= 0 ? &quot;var(--up-soft)&quot; : &quot;var(--down-soft)&quot;;
      const trackColorVar = numeric &gt;= 0 ? &quot;var(--up-track)&quot; : &quot;var(--down-track)&quot;;

        : (themeName === &quot;light&quot; ? &quot;rgba(248, 113, 113, 0.96)&quot; : &quot;rgba(235, 83, 83, 0.96)&quot;);
      const gradientTail = numeric &gt;= 0
        ? (themeName === &quot;light&quot; ? &quot;rgba(110, 231, 183, 0.78)&quot; : &quot;rgba(73, 201, 146, 0.82)&quot;)
        : (themeName === &quot;light&quot; ? &quot;rgba(252, 165, 165, 0.78)&quot; : &quot;rgba(244, 114, 114, 0.82)&quot;);
      return `

            &lt;span class=&quot;metric-value&quot;&gt;${display}&lt;/span&gt;
          &lt;/span&gt;
        &lt;/div&gt;
