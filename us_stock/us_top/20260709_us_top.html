    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function parseNumber(value) {
      const normalized = String(value ?? '').replace('%', '').replace(',', '').trim();
      const num = Number(normalized);
      return Number.isFinite(num) ? num : null;
    }
    function valueClass(column, value) {
      if (!String(column).includes('涨幅') && !String(column).includes('回撤')) return '';
      const num = parseNumber(value);
      if (!Number.isFinite(num) || num === 0) return '';
      return num > 0 ? 'positive' : 'negative';
    }
    function isBarColumn(column) {
      const columnText = String(column);
      return columnText.includes('涨幅') || columnText.includes('回撤') || columnText === '相对52周最高' || columnText === '平均成交额' || columnText === '最高成交额' || columnText === '最新成交额';
    }
    function compareValues(left, right, key) {
      const leftNum = parseNumber(left[key]);
      const rightNum = parseNumber(right[key]);
      if (leftNum !== null && rightNum !== null) return leftNum - rightNum;
      return String(left[key] ?? '').localeCompare(String(right[key] ?? ''), 'zh-Hans-CN');
    }
    function applySort(rows) {
      if (!sortKey) return rows.slice();
      return rows.slice().sort((left, right) => {
        const result = compareValues(left, right, sortKey);
        return sortDesc ? -result : result;
      });
    }
    function renderHead(columns) {
      tableHead.innerHTML = '<tr>' + columns.map((column) => {
        const indicator = sortKey === column ? (sortDesc ? ' ▼' : ' ▲') : ' ↕';
        return `<th data-key="${escapeHtml(column)}">${escapeHtml(column)}<span>${indicator}</span></th>`;
      }).join('') + '</tr>';
      tableHead.querySelectorAll('th[data-key]').forEach((th) => {
        th.addEventListener('click', () => {
          const key = th.dataset.key || '';
          if (sortKey === key) sortDesc = !sortDesc;
          else { sortKey = key; sortDesc = key === '成交额' || key.includes('次数') || key.includes('排名'); }
          render();
        });
      });
    }
    function renderRows(columns, rows) {
      const search = searchInput.value.trim().toLowerCase();
      let filtered = rows.filter((row) => !search || columns.some((column) => String(row[column] ?? '').toLowerCase().includes(search)));
      filtered = applySort(filtered);
      const maxAbsByColumn = Object.fromEntries(columns.map((column) => {
        if (!isBarColumn(column)) return [column, 0];
        const maxAbs = Math.max(...filtered.map((row) => Math.abs(parseNumber(row[column]) ?? 0)), 0);
        return [column, maxAbs || 1];
      }));
      tableBody.innerHTML = filtered.map((row) => {
        return '<tr>' + columns.map((column) => {
          const classNames = [];
          if (column === '排名' || column === '最近排名' || column === '最佳排名') classNames.push('rank-cell');
          if (column === '名称') classNames.push('name-cell');
          const tone = valueClass(column, row[column]);
          if (tone) classNames.push(tone);
          if (isBarColumn(column)) classNames.push('bar-cell');
          const classAttr = classNames.length ? ` class="${classNames.join(' ')}"` : '';
          if (isBarColumn(column)) {
            const num = parseNumber(row[column]) ?? 0;
            const width = Math.max(8, Math.min(100, Math.abs(num) / maxAbsByColumn[column] * 100));
            const isPositive = num >= 0;
            const trackColor = isPositive ? '23, 37, 34' : '60, 22, 28';
            const fillColor = isPositive ? '54, 179, 126' : '235, 83, 83';
            const gradientColor = isPositive ? 'rgba(54, 179, 126, 0.96)' : 'rgba(235, 83, 83, 0.96)';
            const gradientTail = isPositive ? 'rgba(73, 201, 146, 0.82)' : 'rgba(244, 114, 114, 0.82)';
            const trackStyle = `background: rgba(${trackColor}, 0.65);`;
            const fillStyle = `width:${width}%; background:linear-gradient(90deg, ${gradientColor} 0%, ${gradientTail} 100%); box-shadow:inset 0 0 0 1px rgba(${fillColor}, 0.82)`;
            return `<td${classAttr}><div class="bar-track" style="${trackStyle}"><span class="bar-fill" style="${fillStyle}"></span><span class="bar-value">${escapeHtml(row[column] ?? '')}</span></div></td>`;
          }
          return `<td${classAttr}>${escapeHtml(row[column] ?? '')}</td>`;
        }).join('') + '</tr>';
      }).join('');
      summary.textContent = `${filtered.length} / ${rows.length} 行`;
    }
    function buildStatsRows() {
      const selectedDates = statsRange === 'all' ? payload.dates : payload.dates.slice(0, Number(statsRange));
      const selectedDateSet = new Set(selectedDates);
      const groups = new Map();
      payload.rows.forEach((row) => {
        if (!selectedDateSet.has(row['日期'])) return;
        const key = String(row['代码'] || row['名称'] || '').trim().toUpperCase();
        if (!key) return;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(row);
      });
      const stats = [];
      groups.forEach((items) => {
        const latest = items.slice().sort((a, b) => String(b['日期']).localeCompare(String(a['日期'])) || Number(a['排名'] || 9999) - Number(b['排名'] || 9999))[0];
        const best = items.slice().sort((a, b) => Number(a['排名'] || 9999) - Number(b['排名'] || 9999) || (parseNumber(b['成交额']) ?? 0) - (parseNumber(a['成交额']) ?? 0))[0];
        const maxAmount = items.slice().sort((a, b) => (parseNumber(b['成交额']) ?? 0) - (parseNumber(a['成交额']) ?? 0))[0];
        const ranks = items.map((item) => Number(item['排名'] || 0)).filter(Number.isFinite);
        const amounts = items.map((item) => parseNumber(item['成交额']) ?? 0).filter(Number.isFinite);
        const avgRank = ranks.length ? (ranks.reduce((a, b) => a + b, 0) / ranks.length).toFixed(2) : '';
        const avgAmount = amounts.length ? (amounts.reduce((a, b) => a + b, 0) / amounts.length).toFixed(2).replace(/\.00$/, '') : '';
        stats.push({
          '代码': latest['代码'] || '',
          '名称': latest['名称'] || '',
          '最新涨幅': latest['今日涨幅'] || '',
          '最新成交额': latest['成交额'] || '',
          '上榜次数': items.length,
          '平均排名': avgRank,
          '最佳排名': best['排名'] || '',
          '最佳排名日期': best['日期'] || '',
          '平均成交额': avgAmount,
          '最高成交额': maxAmount['成交额'] || '',
          '最高成交额日期': maxAmount['日期'] || '',
          '最近上榜日期': latest['日期'] || '',
          '最近排名': latest['排名'] || '',
        });
      });
      return stats
        .sort((a, b) => Number(b['上榜次数']) - Number(a['上榜次数']) || Number(a['平均排名'] || 9999) - Number(b['平均排名'] || 9999) || String(a['代码']).localeCompare(String(b['代码'])))
        .map((row, index) => ({ '编号': index + 1, ...row }));
    }
    function render() {
      const selectedDate = dateSelect.value;
      if (mode === 'daily') {
        dateSelect.classList.remove('hidden');
        statsRangePanel.classList.remove('active');
        const columns = payload.columns;
        const rows = payload.rows.filter((row) => row['日期'] === selectedDate).sort((a, b) => Number(a['排名'] || 9999) - Number(b['排名'] || 9999));
        if (!sortKey) { sortKey = '排名'; sortDesc = false; }
        renderHead(columns);
        renderRows(columns, rows);
      } else {
        dateSelect.classList.add('hidden');
        statsRangePanel.classList.add('active');
        const columns = ['编号', '代码', '名称', '最新涨幅', '最新成交额', '上榜次数', '平均排名', '最近排名', '最佳排名', '平均成交额', '最高成交额', '最佳排名日期', '最高成交额日期', '最近上榜日期'];
        if (!sortKey || sortKey === '排名') { sortKey = '上榜次数'; sortDesc = true; }
        renderHead(columns);
        renderRows(columns, buildStatsRows());
      }
    }
    payload.dates.forEach((date) => {
      const option = document.createElement('option');
      option.value = date;
      option.textContent = date;
      dateSelect.appendChild(option);
    });
    dailyBtn.addEventListener('click', () => { mode = 'daily'; sortKey = '排名'; sortDesc = false; dailyBtn.classList.add('active'); statsBtn.classList.remove('active'); render(); });
    statsBtn.addEventListener('click', () => { mode = 'stats'; sortKey = '上榜次数'; sortDesc = true; statsBtn.classList.add('active'); dailyBtn.classList.remove('active'); render(); });
    document.querySelectorAll('.range-btn').forEach((button) => {
      button.addEventListener('click', () => {
        statsRange = button.dataset.range || 'all';
        document.querySelectorAll('.range-btn').forEach((item) => item.classList.toggle('active', item === button));
        render();
      });
    });
    dateSelect.addEventListener('change', () => { sortKey = '排名'; sortDesc = false; render(); });
    searchInput.addEventListener('input', render);
    clearSearch.addEventListener('click', () => { searchInput.value = ''; render(); });
    render();
  </script>
</body>
</html>
