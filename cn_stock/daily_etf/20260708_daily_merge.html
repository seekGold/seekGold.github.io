<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纳指ETF历史对比</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.18);
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }
    .hero {
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .hero h1 {
      margin: 0;
      font-size: 26px;
    }
    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(8, 15, 31, 0.82), rgba(15, 23, 42, 0.72));
    }
    .etf-btn {
      border: 1px solid rgba(168, 85, 247, 0.28);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(30, 27, 75, 0.72), rgba(15, 23, 42, 0.88));
      color: #c4b5fd;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 6px 14px rgba(76, 29, 149, 0.12);
      transition: 0.18s ease;
    }
    .etf-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(45, 212, 191, 0.38);
      color: #ccfbf1;
      background: linear-gradient(180deg, rgba(19, 78, 74, 0.48), rgba(15, 23, 42, 0.88));
    }
    .etf-btn.active {
      color: #f8fafc;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.28), rgba(20, 184, 166, 0.24));
      border-color: rgba(45, 212, 191, 0.54);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 22px rgba(20, 184, 166, 0.16);
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .summary-item {
      padding: 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.48);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    .summary-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .summary-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }
    .summary-sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .summary-value-positive {
      color: #f87171;
    }
    .summary-value-negative {
      color: #22c55e;
    }
    .summary-value-neutral {
      color: #e5e7eb;
    }
    .table-card {
      padding: 14px;
    }
    .table-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .table-title {
      font-size: 18px;
      font-weight: 800;
    }
    .table-header-btn {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 800;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .table-header-btn.is-active {
      color: #dbeafe;
    }
    .sort-arrow {
      color: #60a5fa;
      font-size: 11px;
      line-height: 1;
    }
    .table-badge {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.28);
      font-size: 12px;
      font-weight: 700;
    }
    .table-wrap {
      overflow: auto;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1280px;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #162132;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      white-space: nowrap;
    }
    tbody td {
      padding: 11px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      font-size: 13px;
      white-space: nowrap;
    }
    tbody tr:nth-child(odd) td {
      background: rgba(15, 23, 42, 0.24);
    }
    tbody tr:hover td {
      background: rgba(37, 99, 235, 0.08);
    }
    .date-cell {
      color: #bfdbfe;
      font-weight: 700;
    }
    .metric-cell {
      min-width: 110px;
    }
    .metric-bar {
      position: relative;
      height: 22px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(51, 65, 85, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    .metric-bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 999px;
      opacity: 0.92;
    }
    .metric-bar-fill.top-rank-1 {
      filter: brightness(1.18) saturate(1.12);
    }
    .metric-bar-fill.top-rank-2 {
      filter: brightness(1.12) saturate(1.08);
    }
    .metric-bar-fill.top-rank-3 {
      filter: brightness(1.06) saturate(1.04);
    }
    .metric-bar.is-max {
      border-color: rgba(250, 204, 21, 0.8);
      box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.35), 0 0 0 1px rgba(250, 204, 21, 0.18);
    }
    .metric-bar-fill.positive {
      background: linear-gradient(90deg, rgba(239,68,68,0.82), rgba(239,68,68,0.96));
    }
    .metric-bar-fill.negative {
      background: linear-gradient(90deg, rgba(34,197,94,0.82), rgba(34,197,94,0.96));
    }
    .metric-bar-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 8px;
      font-weight: 800;
      color: #f8fafc;
    }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 960px) {
      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

              width = Math.max(width, 18);
              const rankInfo = ((localRankByKey[column.key] || {})[row.date]) || null;
              if (rankInfo) {
                if (rankInfo.isMax) {
                  barExtraClass += " is-max";
                }
                if (rankInfo.rank >= 1 && rankInfo.rank <= 3) {
                  fillExtraClass += " top-rank-" + String(rankInfo.rank);
                }
              }
            }
            return '<td class="metric-cell"><div class="metric-bar' + barExtraClass + '"><div class="metric-bar-fill ' + cls + fillExtraClass + '" style="width:' + width.toFixed(2) + '%"></div><div class="metric-bar-text">' + escapeHtml(cell.text || "-") + "</div></div></td>";
          }
          return "<td>" + escapeHtml(cell.text || "-") + "</td>";
        }).join("");
        return '<tr><td class="date-cell">' + escapeHtml(row.date) + "</td>" + cells + "</tr>";
      }).join("");
    }

    function renderSubtitle() {
      document.getElementById("pageSubtitle").textContent =
        payload.subtitle + "，最新输出日期 " + payload.latestDate;
    }

    function render() {
      const rows = payload.rowsByCode[state.activeCode] || [];
      const meta = getEtfMeta(state.activeCode);
      renderSubtitle();
      renderButtons();
      renderSummary(rows, meta);
      renderTable(rows, meta);
    }

    render();
  </script>
</body>
</html>
