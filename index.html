<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面导航</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fb;
    --card: #ffffff;
    --panel: #fbfcfe;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #d7dfeb;
    --primary: #2563eb;
    --primary-soft: #eaf1ff;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    min-height: 100vh;
    gap: 16px;
    padding: 16px;
  }

  .sidebar,
  .main {
    min-height: calc(100vh - 32px);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .sidebar {
    padding: 18px 14px;
    overflow: auto;
  }

  .brand {
    padding: 4px 6px 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }

  .brand h1 {
    margin: 0 0 6px;
    font-size: 24px;
  }

  .brand p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .tree {
    display: grid;
    gap: 12px;
  }

  .folder {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    padding: 10px;
  }

  .folder-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 4px 10px;
  }

  .folder-name {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .folder-count {
    font-size: 13px;
    color: var(--muted);
  }

  .file-list {
    display: grid;
    gap: 8px;
  }

  .file-btn {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    text-align: left;
    padding: 12px 12px;
    cursor: pointer;
    color: var(--text);
    transition: 0.2s ease;
  }

  .file-btn:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  .file-btn.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
  }

  .file-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    word-break: break-all;
  }

  .file-path {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }

  .folder-empty,
  .tree-status {
    padding: 12px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    font-size: 13px;
    background: #fff;
  }

  .main {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }

  .preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
  }

  .preview-meta {
    min-width: 0;
  }

  .preview-title {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
    word-break: break-all;
  }

  .preview-subtitle {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
  }

  .preview-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 110px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }

  .preview-body {
    position: relative;
    background: #eef3fb;
  }

  .preview-frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }

  .preview-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    color: var(--muted);
    font-size: 15px;
  }

  .preview-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(243, 246, 251, 0.8);
    color: var(--muted);
    font-size: 14px;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 960px) {
    .app {
      grid-template-columns: 1fr;
    }

    .sidebar,
    .main {
      min-height: auto;
    }

    .main {
      height: 78vh;
    }

    .preview-head {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>页面导航</h1>
      <p>左侧显示目录与文件列表，点击后在右侧直接预览 HTML 页面内容</p>
    </div>
    <div class="tree" id="tree">
      <div class="tree-status">正在读取目录文件...</div>
    </div>
  </aside>

  <main class="main">
    <div class="preview-head">
      <div class="preview-meta">
        <h2 class="preview-title" id="previewTitle">请选择左侧文件</h2>
        <p class="preview-subtitle" id="previewSubtitle">右侧会显示对应页面内容</p>
      </div>
      <a class="preview-link hidden" id="previewLink" href="#" target="_blank" rel="noopener noreferrer">新窗口打开</a>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-empty" id="previewEmpty">当前还没有选中文件</div>
      <iframe class="preview-frame hidden" id="previewFrame" title="页面预览"></iframe>
      <div class="preview-loading hidden" id="previewLoading">页面加载中...</div>
    </div>
  </main>
</div>

<script>
  const repoOwner = "seekGold";
  const repoName = "seekGold.github.io";
  const folders = [
    { key: "us_stock", label: "us_stock" },
    { key: "cn_etf", label: "cn_etf" }
  ];

  const treeEl = document.getElementById("tree");
  const previewTitleEl = document.getElementById("previewTitle");
  const previewSubtitleEl = document.getElementById("previewSubtitle");
  const previewLinkEl = document.getElementById("previewLink");
  const previewFrameEl = document.getElementById("previewFrame");
  const previewEmptyEl = document.getElementById("previewEmpty");
  const previewLoadingEl = document.getElementById("previewLoading");

  const state = {
    filesByFolder: {},
    activePath: "",
    activeName: ""
  };

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(char) {
      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      };
      return map[char];
    });
  }

  function getFileUrl(path) {
    return "./" + encodeURI(path);
  }

  async function loadFolder(folder) {
    const url = "https://api.github.com/repos/" + repoOwner + "/" + repoName + "/contents/" + encodeURIComponent(folder);
    const response = await fetch(url);

    if (response.status === 404) {
      return [];
    }

    if (!response.ok) {
      throw new Error("读取失败: " + response.status);
    }

    const data = await response.json();
    return data
      .filter(function(item) {
        return item.type === "file" && /\.html?$/i.test(item.name);
      })
      .sort(function(a, b) {
        return a.name.localeCompare(b.name, "zh-Hans-CN");
      })
      .map(function(item) {
        return {
          name: item.name,
          path: folder + "/" + item.name
        };
      });
  }

  function renderTree() {
    const hasAnyFolder = folders.length > 0;
    if (!hasAnyFolder) {
      treeEl.innerHTML = '<div class="tree-status">没有可展示的目录</div>';
      return;
    }

    treeEl.innerHTML = folders.map(function(folder) {
      const files = state.filesByFolder[folder.key] || [];
      const filesHtml = files.length
        ? files.map(function(file) {
            const activeClass = file.path === state.activePath ? "file-btn active" : "file-btn";
            return [
              '<button class="' + activeClass + '" data-path="' + escapeHtml(file.path) + '" data-name="' + escapeHtml(file.name) + '">',
              '<span class="file-name">' + escapeHtml(file.name) + '</span>',
              '<span class="file-path">' + escapeHtml(file.path) + '</span>',
              '</button>'
            ].join("");
          }).join("")
        : '<div class="folder-empty">当前目录没有 HTML 文件</div>';

      return [
        '<section class="folder">',
        '<div class="folder-head">',
        '<h3 class="folder-name">' + escapeHtml(folder.label) + '</h3>',
        '<span class="folder-count">' + files.length + ' 个文件</span>',
        '</div>',
        '<div class="file-list">' + filesHtml + '</div>',
        '</section>'
      ].join("");
    }).join("");

    treeEl.querySelectorAll(".file-btn").forEach(function(button) {
      button.addEventListener("click", function() {
        const path = button.getAttribute("data-path");
        const name = button.getAttribute("data-name");
        selectFile(path, name);
      });
    });
  }

  function renderPreview() {
    if (!state.activePath) {
      previewTitleEl.textContent = "请选择左侧文件";
      previewSubtitleEl.textContent = "右侧会显示对应页面内容";
      previewLinkEl.classList.add("hidden");
      previewFrameEl.classList.add("hidden");
      previewEmptyEl.classList.remove("hidden");
      previewLoadingEl.classList.add("hidden");
      previewFrameEl.removeAttribute("src");
      return;
    }

    previewTitleEl.textContent = state.activeName;
    previewSubtitleEl.textContent = state.activePath;
    previewLinkEl.href = getFileUrl(state.activePath);
    previewLinkEl.classList.remove("hidden");
    previewEmptyEl.classList.add("hidden");
    previewFrameEl.classList.remove("hidden");
  }

  function selectFile(path, name) {
    state.activePath = path;
    state.activeName = name;
    renderTree();
    renderPreview();
    previewLoadingEl.classList.remove("hidden");
    previewFrameEl.src = getFileUrl(path);
    location.hash = encodeURIComponent(path);
  }

  function getDefaultFile() {
    for (let index = 0; index < folders.length; index += 1) {
      const folderKey = folders[index].key;
      const files = state.filesByFolder[folderKey] || [];
      if (files.length > 0) {
        return files[0];
      }
    }
    return null;
  }

  function findFileByPath(path) {
    for (let index = 0; index < folders.length; index += 1) {
      const folderKey = folders[index].key;
      const files = state.filesByFolder[folderKey] || [];
      const match = files.find(function(file) {
        return file.path === path;
      });
      if (match) {
        return match;
      }
    }
    return null;
  }

  async function init() {
    try {
      const results = await Promise.all(folders.map(function(folder) {
        return loadFolder(folder.key);
      }));

      folders.forEach(function(folder, index) {
        state.filesByFolder[folder.key] = results[index];
      });

      renderTree();

      const hashPath = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
      const initialFile = findFileByPath(hashPath) || getDefaultFile();

      if (initialFile) {
        selectFile(initialFile.path, initialFile.name);
      } else {
        renderPreview();
      }
    } catch (error) {
      treeEl.innerHTML = '<div class="tree-status">目录读取失败，请稍后重试</div>';
      renderPreview();
    }
  }

  previewFrameEl.addEventListener("load", function() {
    previewLoadingEl.classList.add("hidden");
  });

  init();
</script>
</body>
</html>
