<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seek Gold</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fb;
    --card: #ffffff;
    --panel: #fbfcfe;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #d7dfeb;
    --primary: #2563eb;
    --primary-soft: #eaf1ff;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    min-height: 100vh;
    gap: 16px;
    padding: 16px;
  }

  .app.locked {
    display: none;
  }

  .sidebar,
  .main {
    min-height: calc(100vh - 32px);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .sidebar {
    padding: 18px 14px;
    overflow: auto;
  }

  .brand {
    padding: 4px 6px 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }

  .brand h1 {
    margin: 0;
    font-size: 24px;
  }

  .sidebar-controls {
    display: flex;
    gap: 8px;
    margin: 0 6px 14px;
  }

  .view-toggle-btn {
    flex: 1 1 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: #475569;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .view-toggle-btn:hover {
    border-color: #bfdbfe;
    background: #f8fbff;
  }

  .view-toggle-btn.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: #1d4ed8;
  }

  .tree {
    display: grid;
    gap: 6px;
  }

  .tree-group {
    display: grid;
    gap: 4px;
  }

  .tree-children {
    margin-left: 14px;
    padding-left: 12px;
    border-left: 1px solid #e4eaf3;
    display: grid;
    gap: 4px;
  }

  .tree-folder-row,
  .tree-file-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: 0.18s ease;
  }

  .tree-folder-row:hover,
  .tree-file-row:hover {
    background: var(--primary-soft);
    border-color: #d9e6ff;
  }

  .tree-file-row.active {
    background: var(--primary-soft);
    border-color: var(--primary);
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
  }

  .tree-arrow {
    width: 14px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    flex: 0 0 14px;
    transition: transform 0.18s ease;
  }

  .tree-folder-row.expanded .tree-arrow {
    transform: rotate(90deg);
  }

  .tree-icon {
    width: 18px;
    text-align: center;
    flex: 0 0 18px;
    font-size: 15px;
  }

  .tree-folder-meta,
  .tree-file-meta {
    min-width: 0;
    flex: 1 1 auto;
  }

  .tree-folder-name,
  .tree-file-name {
    display: block;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    word-break: break-all;
  }

  .tree-folder-name {
    color: #334155;
  }

  .tree-file-name {
    color: #475569;
  }

  .tree-file-row.active .tree-file-name {
    color: #1e3a8a;
    font-weight: 600;
  }

  .tree-folder-path,
  .tree-file-path {
    display: none;
  }

  .tree-badge {
    flex: 0 0 auto;
    min-width: 44px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef3fb;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  .file-list {
    display: grid;
    gap: 8px;
  }

  .file-btn {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    text-align: left;
    padding: 12px 12px;
    cursor: pointer;
    color: var(--text);
    transition: 0.2s ease;
  }

  .file-btn:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  .file-btn.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
  }

  .file-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    word-break: break-all;
  }

  .file-path {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }

  .folder-empty,
  .tree-status {
    padding: 12px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    font-size: 13px;
    background: #fff;
  }

  .tree-empty-children {
    margin: 2px 0 6px 44px;
    padding: 8px 10px;
    border-radius: 10px;
    background: #fafcff;
    color: var(--muted);
    font-size: 12px;
  }

  .latest-list {
    display: grid;
    gap: 8px;
  }

  .latest-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .latest-item:hover {
    background: #f8fbff;
    border-color: #bfdbfe;
  }

  .latest-item.active {
    background: var(--primary-soft);
    border-color: var(--primary);
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
  }

  .latest-meta {
    min-width: 0;
    flex: 1 1 auto;
  }

  .latest-folder {
    display: block;
    margin-bottom: 3px;
    color: #64748b;
    font-size: 11px;
    line-height: 1.3;
    word-break: break-all;
  }

  .latest-name {
    display: block;
    color: #334155;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    word-break: break-all;
  }

  .latest-item.active .latest-name {
    color: #1e3a8a;
  }

  .latest-badge {
    flex: 0 0 auto;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 11px;
    font-weight: 600;
  }

  .main {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }

  .preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
  }

  .preview-meta {
    min-width: 0;
  }

  .preview-title {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
    word-break: break-all;
  }

  .preview-subtitle {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
  }

  .preview-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 110px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }

  .preview-body {
    position: relative;
    background: #eef3fb;
  }

  .preview-frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }

  .preview-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    color: var(--muted);
    font-size: 15px;
  }

  .preview-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(243, 246, 251, 0.8);
    color: var(--muted);
    font-size: 14px;
  }

  .hidden {
    display: none;
  }

  .password-gate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(6px);
  }

  .password-card {
    width: min(360px, 100%);
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
  }

  .password-title {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 700;
    color: #1f2937;
  }

  .password-desc {
    margin: 0 0 14px;
    font-size: 13px;
    line-height: 1.5;
    color: #64748b;
  }

  .password-input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
    color: #1f2937;
    background: #fff;
  }

  .password-input:focus {
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.24);
  }

  .password-submit {
    width: 100%;
    margin-top: 12px;
    padding: 11px 12px;
    border: 1px solid var(--primary);
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .password-submit:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }

  .password-error {
    min-height: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: #dc2626;
  }

  @media (max-width: 960px) {
    .app {
      grid-template-columns: 1fr;
    }

    .sidebar,
    .main {
      min-height: auto;
    }

    .main {
      height: 78vh;
    }

    .preview-head {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<div class="password-gate" id="passwordGate">
  <div class="password-card">
    <h2 class="password-title">Seek Gold</h2>
    <p class="password-desc">请输入访问密码后再加载完整内容</p>
    <input id="passwordInput" class="password-input" type="password" placeholder="请输入密码" autocomplete="current-password">
    <button id="passwordSubmit" class="password-submit" type="button">进入</button>
    <div id="passwordError" class="password-error"></div>
  </div>
</div>

<div class="app locked" id="appRoot">
  <aside class="sidebar">
    <div class="brand">
      <h1>Seek Gold</h1>
    </div>
    <div class="sidebar-controls" id="viewToggle">
      <button class="view-toggle-btn" data-view-mode="tree">目录树</button>
      <button class="view-toggle-btn active" data-view-mode="latest">各目录最新</button>
    </div>
    <div class="tree" id="tree">
      <div class="tree-status">正在读取目录文件...</div>
    </div>
  </aside>

  <main class="main">
    <div class="preview-head">
      <div class="preview-meta">
        <h2 class="preview-title" id="previewTitle">请选择左侧文件</h2>
        <p class="preview-subtitle" id="previewSubtitle">右侧会显示对应页面内容</p>
      </div>
      <a class="preview-link hidden" id="previewLink" href="#" target="_blank" rel="noopener noreferrer">新窗口打开</a>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-empty" id="previewEmpty">当前还没有选中文件</div>
      <iframe class="preview-frame hidden" id="previewFrame" title="页面预览"></iframe>
      <div class="preview-loading hidden" id="previewLoading">页面加载中...</div>
    </div>
  </main>
</div>

<script src="./site-index.js"></script>
<script>
  const treeEl = document.getElementById("tree");
  const viewToggleEl = document.getElementById("viewToggle");
  const appRootEl = document.getElementById("appRoot");
  const passwordGateEl = document.getElementById("passwordGate");
  const passwordInputEl = document.getElementById("passwordInput");
  const passwordSubmitEl = document.getElementById("passwordSubmit");
  const passwordErrorEl = document.getElementById("passwordError");
  const previewTitleEl = document.getElementById("previewTitle");
  const previewSubtitleEl = document.getElementById("previewSubtitle");
  const previewLinkEl = document.getElementById("previewLink");
  const previewFrameEl = document.getElementById("previewFrame");
  const previewEmptyEl = document.getElementById("previewEmpty");
  const previewLoadingEl = document.getElementById("previewLoading");

  const state = {
    tree: null,
    latestFiles: [],
    viewMode: "latest",
    expandedFolders: {},
    activePath: "",
    activeName: ""
  };

  const PASSWORD_HASH = "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3";
  const PASSWORD_SESSION_KEY = "seek_gold_unlocked";

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(char) {
      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      };
      return map[char];
    });
  }

  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const buffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buffer)).map(function(value) {
      return value.toString(16).padStart(2, "0");
    }).join("");
  }

  function unlockApp() {
    passwordGateEl.remove();
    appRootEl.classList.remove("locked");
  }

  function getFileUrl(path) {
    return "./" + encodeURI(path);
  }

  function getFileDateValue(name) {
    const match = name.match(/^(\d{8})/);
    return match ? Number(match[1]) : -1;
  }

  function sortFilesByDateDesc(files) {
    return files.slice().sort(function(a, b) {
      const dateDiff = getFileDateValue(b.name) - getFileDateValue(a.name);
      if (dateDiff !== 0) {
        return dateDiff;
      }
      return b.name.localeCompare(a.name, "zh-Hans-CN");
    });
  }

  async function loadAllHtmlFiles() {
    if (Array.isArray(window.SEEK_GOLD_FILE_INDEX) && window.SEEK_GOLD_FILE_INDEX.length > 0) {
      return window.SEEK_GOLD_FILE_INDEX.map(function(item) {
        const segments = item.path.split("/");
        return {
          name: item.name || segments[segments.length - 1],
          path: item.path,
          folder: item.folder || segments.slice(0, -1).join("/")
        };
      });
    }

    throw new Error("文件索引缺失");
  }

  function createFolderNode(name, path) {
    return {
      type: "folder",
      name: name,
      path: path,
      folders: [],
      files: [],
      latestDate: -1,
      fileCount: 0
    };
  }

  function buildTree(files) {
    const root = createFolderNode("", "");
    const folderMap = { "": root };

    files.forEach(function(file) {
      const segments = file.path.split("/");
      let currentPath = "";
      let currentNode = root;

      for (let index = 0; index < segments.length - 1; index += 1) {
        const segment = segments[index];
        currentPath = currentPath ? currentPath + "/" + segment : segment;

        if (!folderMap[currentPath]) {
          const nextNode = createFolderNode(segment, currentPath);
          folderMap[currentPath] = nextNode;
          currentNode.folders.push(nextNode);
        }

        currentNode = folderMap[currentPath];
      }

      currentNode.files.push(file);
    });

    function finalizeFolder(node) {
      node.files = sortFilesByDateDesc(node.files);

      node.folders.forEach(function(child) {
        finalizeFolder(child);
      });

      node.folders.sort(function(a, b) {
        if (b.latestDate !== a.latestDate) {
          return b.latestDate - a.latestDate;
        }
        return a.path.localeCompare(b.path, "zh-Hans-CN");
      });

      const ownLatest = node.files.length ? getFileDateValue(node.files[0].name) : -1;
      const childLatest = node.folders.length ? node.folders[0].latestDate : -1;
      node.latestDate = Math.max(ownLatest, childLatest);

      const childFileCount = node.folders.reduce(function(sum, child) {
        return sum + child.fileCount;
      }, 0);
      node.fileCount = node.files.length + childFileCount;
    }

    finalizeFolder(root);
    return root;
  }

  function initializeExpandedFolders(node) {
    node.folders.forEach(function(folder) {
      state.expandedFolders[folder.path] = true;
      initializeExpandedFolders(folder);
    });
  }

  function collectLatestFiles(node, result) {
    if (node.path && node.files.length > 0) {
      result.push({
        folderPath: node.path,
        file: node.files[0]
      });
    }

    node.folders.forEach(function(folder) {
      collectLatestFiles(folder, result);
    });
  }

  function buildLatestFiles(tree) {
    const result = [];
    collectLatestFiles(tree, result);
    return result.sort(function(a, b) {
      const dateDiff = getFileDateValue(b.file.name) - getFileDateValue(a.file.name);
      if (dateDiff !== 0) {
        return dateDiff;
      }
      return a.folderPath.localeCompare(b.folderPath, "zh-Hans-CN");
    });
  }

  function renderFileNode(file) {
    const activeClass = file.path === state.activePath ? "tree-file-row active" : "tree-file-row";
    return [
      '<button class="' + activeClass + '" data-file-path="' + escapeHtml(file.path) + '" data-file-name="' + escapeHtml(file.name) + '">',
      '<span class="tree-arrow"></span>',
      '<span class="tree-icon">📄</span>',
      '<span class="tree-file-meta">',
      '<span class="tree-file-name">' + escapeHtml(file.name) + '</span>',
      '<span class="tree-file-path">' + escapeHtml(file.path) + '</span>',
      '</span>',
      '</button>'
    ].join("");
  }

  function renderFolderNode(folder, depth) {
    const expanded = state.expandedFolders[folder.path] !== false;
    const rowClass = expanded ? "tree-folder-row expanded" : "tree-folder-row";
    const children = [];

    folder.folders.forEach(function(childFolder) {
      children.push(renderFolderNode(childFolder, depth + 1));
    });

    folder.files.forEach(function(file) {
      children.push(renderFileNode(file));
    });

    const childrenHtml = children.length
      ? '<div class="tree-children' + (expanded ? "" : ' hidden') + '">' + children.join("") + "</div>"
      : '<div class="tree-empty-children' + (expanded ? "" : ' hidden') + '">当前目录没有 HTML 文件</div>';

    return [
      '<div class="tree-group">',
      '<button class="' + rowClass + '" data-folder-path="' + escapeHtml(folder.path) + '">',
      '<span class="tree-arrow">▶</span>',
      '<span class="tree-icon">📁</span>',
      '<span class="tree-folder-meta">',
      '<span class="tree-folder-name">' + escapeHtml(folder.name) + '</span>',
      '<span class="tree-folder-path">' + escapeHtml(folder.path) + '</span>',
      '</span>',
      '<span class="tree-badge">' + folder.fileCount + ' 个</span>',
      '</button>',
      childrenHtml,
      '</div>'
    ].join("");
  }

  function bindFileEvents() {
    viewToggleEl.querySelectorAll("[data-view-mode]").forEach(function(button) {
      button.classList.toggle("active", button.getAttribute("data-view-mode") === state.viewMode);
    });

    treeEl.querySelectorAll("[data-file-path]").forEach(function(button) {
      button.addEventListener("click", function() {
        const path = button.getAttribute("data-file-path");
        const name = button.getAttribute("data-file-name");
        selectFile(path, name);
      });
    });

    treeEl.querySelectorAll("[data-folder-path]").forEach(function(button) {
      button.addEventListener("click", function() {
        const path = button.getAttribute("data-folder-path");
        state.expandedFolders[path] = !(state.expandedFolders[path] !== false);
        renderTree();
      });
    });
  }

  function renderLatestView() {
    if (state.latestFiles.length === 0) {
      treeEl.innerHTML = '<div class="tree-status">当前没有可展示的 HTML 文件</div>';
      return;
    }

    treeEl.innerHTML = '<div class="latest-list">' + state.latestFiles.map(function(item) {
      const activeClass = item.file.path === state.activePath ? "latest-item active" : "latest-item";
      return [
        '<button class="' + activeClass + '" data-file-path="' + escapeHtml(item.file.path) + '" data-file-name="' + escapeHtml(item.file.name) + '">',
        '<span class="tree-icon">📄</span>',
        '<span class="latest-meta">',
        '<span class="latest-folder">' + escapeHtml(item.folderPath) + '</span>',
        '<span class="latest-name">' + escapeHtml(item.file.name) + '</span>',
        '</span>',
        '<span class="latest-badge">最新</span>',
        '</button>'
      ].join("");
    }).join("") + "</div>";
  }

  function renderTree() {
    if (!state.tree || (state.tree.fileCount || 0) === 0) {
      treeEl.innerHTML = '<div class="tree-status">当前没有可展示的 HTML 文件</div>';
      return;
    }

    if (state.viewMode === "latest") {
      renderLatestView();
    } else {
      treeEl.innerHTML = state.tree.folders.map(function(folder) {
        return renderFolderNode(folder, 0);
      }).join("");
    }

    bindFileEvents();
  }

  function renderPreview() {
    if (!state.activePath) {
      previewTitleEl.textContent = "请选择左侧文件";
      previewSubtitleEl.textContent = "右侧会显示对应页面内容";
      previewLinkEl.classList.add("hidden");
      previewFrameEl.classList.add("hidden");
      previewEmptyEl.classList.remove("hidden");
      previewLoadingEl.classList.add("hidden");
      previewFrameEl.removeAttribute("src");
      return;
    }

    previewTitleEl.textContent = state.activeName;
    previewSubtitleEl.textContent = state.activePath;
    previewLinkEl.href = getFileUrl(state.activePath);
    previewLinkEl.classList.remove("hidden");
    previewEmptyEl.classList.add("hidden");
    previewFrameEl.classList.remove("hidden");
  }

  function selectFile(path, name) {
    state.activePath = path;
    state.activeName = name;
    renderTree();
    renderPreview();
    previewLoadingEl.classList.remove("hidden");
    previewFrameEl.src = getFileUrl(path);
    location.hash = encodeURIComponent(path);
  }

  function getDefaultFile() {
    function walk(node) {
      if (node.files.length > 0) {
        return node.files[0];
      }
      for (let index = 0; index < node.folders.length; index += 1) {
        const result = walk(node.folders[index]);
        if (result) {
          return result;
        }
      }
      return null;
    }

    return state.tree ? walk(state.tree) : null;
  }

  function findFileByPath(path) {
    function walk(node) {
      const ownMatch = node.files.find(function(file) {
        return file.path === path;
      });
      if (ownMatch) {
        return ownMatch;
      }

      for (let index = 0; index < node.folders.length; index += 1) {
        const result = walk(node.folders[index]);
        if (result) {
          return result;
        }
      }

      return null;
    }

    return state.tree ? walk(state.tree) : null;
  }

  async function init() {
    try {
      const files = await loadAllHtmlFiles();
      state.tree = buildTree(files);
      state.latestFiles = buildLatestFiles(state.tree);
      initializeExpandedFolders(state.tree);
      renderTree();

      const hashPath = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
      const initialFile = findFileByPath(hashPath) || getDefaultFile();

      if (initialFile) {
        selectFile(initialFile.path, initialFile.name);
      } else {
        renderPreview();
      }
    } catch (error) {
      treeEl.innerHTML = '<div class="tree-status">目录读取失败，请稍后重试</div>';
      renderPreview();
    }
  }

  previewFrameEl.addEventListener("load", function() {
    previewLoadingEl.classList.add("hidden");
  });

  viewToggleEl.querySelectorAll("[data-view-mode]").forEach(function(button) {
    button.addEventListener("click", function() {
      const nextMode = button.getAttribute("data-view-mode");
      if (nextMode === state.viewMode) {
        return;
      }
      state.viewMode = nextMode;
      renderTree();
    });
  });

  async function verifyPassword() {
    const password = passwordInputEl.value;
    if (!password) {
      passwordErrorEl.textContent = "请输入密码";
      return;
    }

    passwordSubmitEl.disabled = true;
    passwordErrorEl.textContent = "";

    try {
      const hash = await sha256(password);
      if (hash !== PASSWORD_HASH) {
        passwordErrorEl.textContent = "密码错误";
        return;
      }

      sessionStorage.setItem(PASSWORD_SESSION_KEY, "1");
      unlockApp();
      init();
    } finally {
      passwordSubmitEl.disabled = false;
    }
  }

  if (sessionStorage.getItem(PASSWORD_SESSION_KEY) === "1") {
    unlockApp();
    init();
  } else {
    passwordSubmitEl.addEventListener("click", verifyPassword);
    passwordInputEl.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        verifyPassword();
      }
    });
    setTimeout(function() {
      passwordInputEl.focus();
    }, 0);
  }
</script>
</body>
</html>
