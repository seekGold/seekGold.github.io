<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面导航</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #dbe2ea;
    --primary: #2563eb;
    --primary-soft: #e8f0ff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  .desc {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .tab {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  .tab.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .panel-title {
    margin: 0;
    font-size: 18px;
  }

  .status {
    font-size: 13px;
    color: var(--muted);
  }

  .list {
    display: grid;
    gap: 10px;
  }

  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    background: #fff;
  }

  .item:hover {
    border-color: var(--primary);
    background: #fafcff;
  }

  .item-name {
    font-size: 15px;
    word-break: break-all;
  }

  .item-tag {
    flex: 0 0 auto;
    color: var(--primary);
    font-size: 13px;
  }

  .empty,
  .error,
  .loading {
    padding: 18px 14px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    font-size: 14px;
    background: #fff;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>页面导航</h1>
  <p class="desc">点击目录后展示该目录下全部 HTML 文件，支持打开 `us_stock` 和 `cn_etf`</p>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="panel-head">
      <h2 class="panel-title" id="panelTitle">加载中</h2>
      <div class="status" id="panelStatus"></div>
    </div>
    <div id="content" class="loading">正在读取目录文件...</div>
  </div>
</div>

<script>
  const repoOwner = "seekGold";
  const repoName = "seekGold.github.io";
  const folders = [
    { key: "us_stock", label: "us_stock" },
    { key: "cn_etf", label: "cn_etf" }
  ];

  const tabsEl = document.getElementById("tabs");
  const panelTitleEl = document.getElementById("panelTitle");
  const panelStatusEl = document.getElementById("panelStatus");
  const contentEl = document.getElementById("content");

  let activeFolder = folders[0].key;
  const cache = {};

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(char) {
      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      };
      return map[char];
    });
  }

  function renderTabs() {
    tabsEl.innerHTML = folders.map(function(folder) {
      const activeClass = folder.key === activeFolder ? "tab active" : "tab";
      return '<button class="' + activeClass + '" data-folder="' + folder.key + '">' + folder.label + "</button>";
    }).join("");

    tabsEl.querySelectorAll("button").forEach(function(button) {
      button.addEventListener("click", function() {
        const nextFolder = button.getAttribute("data-folder");
        if (nextFolder === activeFolder) {
          return;
        }
        activeFolder = nextFolder;
        renderTabs();
        renderFolder();
      });
    });
  }

  async function loadFolder(folder) {
    if (cache[folder]) {
      return cache[folder];
    }

    const url = "https://api.github.com/repos/" + repoOwner + "/" + repoName + "/contents/" + encodeURIComponent(folder);
    const response = await fetch(url);

    if (response.status === 404) {
      cache[folder] = [];
      return cache[folder];
    }

    if (!response.ok) {
      throw new Error("读取失败: " + response.status);
    }

    const data = await response.json();
    const htmlFiles = data
      .filter(function(item) {
        return item.type === "file" && /\.html?$/i.test(item.name);
      })
      .sort(function(a, b) {
        return a.name.localeCompare(b.name, "zh-Hans-CN");
      })
      .map(function(item) {
        return {
          name: item.name,
          path: folder + "/" + item.name
        };
      });

    cache[folder] = htmlFiles;
    return htmlFiles;
  }

  async function renderFolder() {
    panelTitleEl.textContent = activeFolder;
    panelStatusEl.textContent = "读取中";
    contentEl.className = "loading";
    contentEl.textContent = "正在读取目录文件...";

    try {
      const files = await loadFolder(activeFolder);

      panelStatusEl.textContent = "共 " + files.length + " 个页面";

      if (files.length === 0) {
        contentEl.className = "empty";
        contentEl.textContent = "当前目录没有可打开的 HTML 文件";
        return;
      }

      contentEl.className = "list";
      contentEl.innerHTML = files.map(function(file) {
        return [
          '<a class="item" href="./' + encodeURI(file.path) + '" target="_blank" rel="noopener noreferrer">',
          '<span class="item-name">' + escapeHtml(file.name) + "</span>",
          '<span class="item-tag">打开</span>',
          "</a>"
        ].join("");
      }).join("");
    } catch (error) {
      panelStatusEl.textContent = "读取失败";
      contentEl.className = "error";
      contentEl.textContent = "目录读取失败，请稍后重试";
    }
  }

  renderTabs();
  renderFolder();
</script>
</body>
</html>
